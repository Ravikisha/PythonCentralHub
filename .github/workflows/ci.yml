name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `astro check && astro build` (see package.json "build" script).
      - name: Build
        run: npm run build
