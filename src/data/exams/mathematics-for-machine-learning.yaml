# Final assessment — Mathematics for Machine Learning (MATH 120).
# Format and house style: see tutorials.yaml. Math is written in plain text.
module: mathematics-for-machine-learning
title: Mathematics for Machine Learning — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "What is the dot product of the vectors a = (1, 2, 3) and b = (4, -5, 6)?"
    options:
      - "(4, -10, 18)"
      - "32"
      - "-12"
      - "12"
    answer: 3
    explain: "Multiply matching components and sum: 1*4 + 2*(-5) + 3*6 = 4 - 10 + 18 = 12. The vector (4, -10, 18) is the element-wise product, not the dot product."

  - q: "A is a 3x4 matrix and B is a 4x2 matrix. Which statement about the product is correct?"
    options:
      - "A times B is 4x4"
      - "A times B is 3x2"
      - "B times A is defined and is 2x3"
      - "Neither product is defined"
    answer: 1
    explain: "Inner dimensions (4 and 4) must match and the result takes the outer ones, giving 3x2. B times A would need 2 to equal 3, so it is undefined."

  - q: "If a matrix M has an eigenvector v with eigenvalue 3, what is M applied to 2v?"
    options:
      - "3v"
      - "2v"
      - "6v"
      - "9v"
    answer: 2
    explain: "M(2v) = 2(Mv) = 2(3v) = 6v. Scaling an eigenvector gives another eigenvector with the same eigenvalue."

  - q: "What is the derivative of f(x) = 3x^2 + 5x with respect to x, evaluated at x = 2?"
    options:
      - "17"
      - "22"
      - "12"
      - "11"
    answer: 0
    explain: "f'(x) = 6x + 5, so f'(2) = 12 + 5 = 17."

  - q: "For f(x, y) = x^2 * y, what is the partial derivative with respect to x at the point (3, 2)?"
    options:
      - "9"
      - "18"
      - "12"
      - "6"
    answer: 2
    explain: "Treat y as constant: df/dx = 2xy = 2*3*2 = 12. The value 9 is df/dy, which is x^2."

  - q: "In gradient descent, the gradient of the loss at the current weights points in which direction, and how are weights updated?"
    options:
      - "Toward the minimum; add the gradient"
      - "Toward the steepest increase; subtract learning rate times gradient"
      - "Perpendicular to the loss surface; add learning rate times gradient"
      - "Toward the steepest increase; add learning rate times gradient"
    answer: 1
    explain: "The gradient points uphill, so descent moves against it: w = w - lr * gradient."

  - q: "Two fair six-sided dice are rolled. What is the probability that the sum is 7?"
    options:
      - "1/12"
      - "1/9"
      - "1/6"
      - "7/36"
    answer: 2
    explain: "Six of the 36 equally likely outcomes sum to 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). So 6/36 = 1/6."

  - q: "A disease affects 1% of people. A test is 90% sensitive and has a 9% false-positive rate. Roughly what is the probability that a person who tests positive is ill?"
    options:
      - "About 90%"
      - "About 50%"
      - "About 9%"
      - "About 30%"
    answer: 3
    explain: "Bayes' rule: true positives 0.01*0.90 = 0.009; false positives 0.99*0.09 = 0.0891. Posterior = 0.009 / 0.0981, which is about 9%. Low prevalence dominates."

  - q: "Data has mean 10 and standard deviation 2. What is the z-score of the value 16?"
    options:
      - "6"
      - "3"
      - "1.6"
      - "8"
    answer: 1
    explain: "z = (x - mean) / sd = (16 - 10) / 2 = 3, meaning the value is three standard deviations above the mean."

  - q: "Which statement about covariance and correlation is true?"
    options:
      - "Correlation is covariance scaled by both standard deviations, so it lies between -1 and 1"
      - "Both are always between -1 and 1"
      - "Correlation depends on the units of the variables but covariance does not"
      - "Zero correlation always means the variables are independent"
    answer: 0
    explain: "Dividing covariance by the product of standard deviations removes units and bounds the result. Zero correlation only rules out a linear relationship."

  - q: "Principal Component Analysis chooses the first principal component as the direction that does what?"
    options:
      - "Maximises the variance of the projected data"
      - "Minimises the number of features"
      - "Is aligned with the class labels"
      - "Has the smallest eigenvalue of the covariance matrix"
    answer: 0
    explain: "The first component is the eigenvector of the covariance matrix with the largest eigenvalue, the direction along which data spreads most. Labels are not used."

  - q: "A model assigns probabilities (0.7, 0.2, 0.1) to three classes and the true class is the first. What is the cross-entropy loss using natural log?"
    options:
      - "About 0.80, from -ln(0.45)"
      - "About 1.61, from -ln(0.2)"
      - "0.7"
      - "About 0.36, from -ln(0.7)"
    answer: 3
    explain: "Cross-entropy with a one-hot target is minus the log of the probability given to the true class: -ln(0.7) is about 0.357."
