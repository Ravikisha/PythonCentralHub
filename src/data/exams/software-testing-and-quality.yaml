# Final assessment — Software Testing and Quality (SE 230).
# Format and house style: see tutorials.yaml.
module: software-testing-and-quality
title: Software Testing and Quality — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "In the test pyramid, why should most of your automated tests be unit tests?"
    options:
      - "They cover the whole system including the UI"
      - "They are fast, isolated and pinpoint failures, so many can run on every change"
      - "They never need assertions"
      - "They replace the need for integration tests"
    answer: 1
    explain: "Unit tests run in milliseconds and fail close to the cause. Slower integration and end-to-end tests are kept fewer because they are costly and harder to diagnose."

  - q: "What does this pytest test do?\n\n```python\ndef test_divide():\n    with pytest.raises(ZeroDivisionError):\n        divide(1, 0)\n```"
    options:
      - "Passes only if `divide` returns 0"
      - "Fails if any exception is raised"
      - "Passes only if `divide(1, 0)` raises `ZeroDivisionError`, and fails if it returns normally"
      - "Ignores exceptions and always passes"
    answer: 2
    explain: "`pytest.raises` asserts that the block raises the named exception. No exception, or a different one, makes the test fail."

  - q: "A function reads the current time with `datetime.now()`, making its tests flaky. What is the best fix?"
    options:
      - "Add `time.sleep()` to the tests"
      - "Retry the test until it passes"
      - "Skip the test on weekends"
      - "Inject the clock or patch `datetime` so tests control the value"
    answer: 3
    explain: "Flakiness comes from an uncontrolled input. Making time a parameter or patching it makes the test deterministic."

  - q: "Which is the best use of a mock object?"
    options:
      - "Replacing a slow or external dependency such as an HTTP API, so the unit under test runs in isolation"
      - "Replacing the function you are testing"
      - "Making failing tests pass"
      - "Measuring code coverage"
    answer: 0
    explain: "Mocks stand in for collaborators so tests are fast and deterministic. Mocking the code under test proves nothing."

  - q: "A test uses `@pytest.mark.parametrize(\"n, expected\", [(2, True), (3, True), (4, False), (9, False)])` on `is_prime`. What is the main benefit?"
    options:
      - "It runs each case as a separate test, so one failing case does not hide the others"
      - "It makes the function faster"
      - "It generates random inputs"
      - "It reduces the number of assertions to zero"
    answer: 0
    explain: "Each tuple becomes its own test item with its own pass or fail status and report, which avoids copy-pasted tests and hidden failures."

  - q: "A suite reports 100% line coverage, yet a bug ships. Which explanation is most plausible?"
    options:
      - "Coverage tools are always wrong"
      - "Unit tests cannot find bugs"
      - "100% coverage guarantees no branches exist"
      - "Lines were executed but the tests did not assert the right behaviour or check edge cases"
    answer: 3
    explain: "Coverage measures which code ran, not whether the results were verified. Weak assertions and missing boundary cases let bugs pass."

  - q: "In test-driven development, what is the correct order of a cycle?"
    options:
      - "Write code, write tests, refactor"
      - "Refactor, write code, write tests"
      - "Write a failing test, make it pass with minimal code, then refactor"
      - "Write tests after release"
    answer: 2
    explain: "Red, green, refactor: the failing test defines the behaviour, the minimal code satisfies it, and refactoring is made safe by the passing test."

  - q: "Which test is the best boundary-value test for `is_adult(age)` that returns True when `age >= 18`?"
    options:
      - "Testing only ages 30 and 40"
      - "Testing 17 and 18"
      - "Testing 1000"
      - "Testing a random string"
    answer: 1
    explain: "Off-by-one errors sit at the edge of a rule. Checking both sides of the boundary (17 and 18) would catch `>` written instead of `>=`."

  - q: "Two tests pass alone but one fails when the whole suite runs in a different order. What is the likely cause?"
    options:
      - "The failing test depends on shared state left by another test, such as a global or database row"
      - "pytest is randomly failing"
      - "The assertions are too strict"
      - "The functions have too many parameters"
    answer: 0
    explain: "Order dependence signals a lack of test isolation. Use fixtures that set up and tear down state so each test starts clean."

  - q: "What does a linter such as flake8 or ruff provide that tests do not?"
    options:
      - "Proof the program is bug free"
      - "Measurement of runtime performance"
      - "Static checks of style and suspicious code such as unused variables, without running the program"
      - "Automatic test generation"
    answer: 2
    explain: "Linters analyse source statically to flag problems early. They complement tests, which check behaviour at runtime."

  - q: "Why run tests in a CI pipeline on every pull request?"
    options:
      - "To avoid writing documentation"
      - "To make code review unnecessary"
      - "To speed up the application"
      - "To catch regressions automatically in a clean, shared environment before merging"
    answer: 3
    explain: "CI runs the suite in a reproducible environment for every change, so breakages are found before they reach the main branch and not on a developer's machine only."

  - q: "A bug is reported in production. What is the best first step before fixing it?"
    options:
      - "Fix the code straight away"
      - "Write a test that reproduces the bug and fails, then fix it so the test passes"
      - "Delete the related tests"
      - "Add more logging and wait a month"
    answer: 1
    explain: "A failing reproduction confirms you understand the bug and stays in the suite as a regression guard."
