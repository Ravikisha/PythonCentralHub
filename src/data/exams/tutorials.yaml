# Final assessment — Python Tutorials.
#
# Reference exam. `scripts/seed-exams.mjs` splits this file in two on upload:
# the question text and options go to Firestore `exams/tutorials` (readable by
# a signed-in account), and the `answer` indexes go to `examKeys/tutorials`,
# which no client can read. Grading happens in the `gradeExam` function.
#
# Writing more of these:
#   - answer is a zero-based index into options
#   - test whether the reader can predict what Python does, not whether they
#     remember a sentence from a page; every question here is answerable by
#     reasoning about the language
#   - keep options plausible: a question with three obvious throwaways is a
#     free mark
#   - explain is shown after grading, and must not give away other answers
module: tutorials
title: Python Tutorials — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "What does `[1, 2, 3][::-1]` evaluate to?"
    options:
      - "[3, 2, 1]"
      - "[1, 2, 3]"
      - "[3]"
      - "A TypeError"
    answer: 0
    explain: "A slice with step -1 walks the list backwards, producing a reversed copy. The original list is untouched."

  - q: "After `a = [1, 2]` and `b = a`, what is `a` once `b.append(3)` runs?"
    options:
      - "[1, 2]"
      - "[1, 2, 3]"
      - "[3, 1, 2]"
      - "It raises an error because b is not a copy"
    answer: 1
    explain: "`b = a` binds a second name to the same list object rather than copying it, so mutating through either name is visible through both. `b = a[:]` or `list(a)` would copy."

  - q: "Which expression returns the number of distinct words in `text.split()`?"
    options:
      - "len(text.split())"
      - "len(set(text.split()))"
      - "count(text.split())"
      - "text.split().unique()"
    answer: 1
    explain: "A set discards duplicates, so its length is the count of distinct items. `len()` on the list alone counts every occurrence."

  - q: "What is printed?\n\n```python\nd = {'a': 1}\nprint(d.get('b', 0))\n```"
    options:
      - "0"
      - "None"
      - "KeyError"
      - "b"
    answer: 0
    explain: "`get` returns its second argument when the key is absent, which is why it is the usual way to read a key that may not be there."

  - q: "Which statement about tuples is true?"
    options:
      - "A tuple cannot contain a list"
      - "A tuple cannot be rebound to a new value"
      - "A tuple's own contents cannot be reassigned by index"
      - "A tuple cannot be used as a dict key under any circumstances"
    answer: 2
    explain: "Tuples do not support item assignment. They may still hold mutable objects, and a tuple of hashable items is itself hashable."

  - q: "What does this print?\n\n```python\nfor i in range(3):\n    if i == 1:\n        continue\n    print(i, end=' ')\n```"
    options:
      - "0 1 2"
      - "0 2"
      - "0"
      - "1"
    answer: 1
    explain: "`continue` skips the rest of the current iteration and moves to the next, so only the iteration where i is 1 prints nothing."

  - q: "Which clause of a `try` statement runs whether or not an exception was raised?"
    options:
      - "except"
      - "else"
      - "finally"
      - "raise"
    answer: 2
    explain: "`finally` always runs, which is what makes it the right place for cleanup. `else` runs only when no exception was raised."

  - q: "What is the value of `x` after `x = '5' * 3`?"
    options:
      - "15"
      - "'555'"
      - "'5 5 5'"
      - "A TypeError"
    answer: 1
    explain: "Multiplying a string by an integer repeats it. Getting 15 would need `int('5') * 3`."

  - q: "Which function signature gives every call its own empty list?"
    options:
      - "def f(items=[]):"
      - "def f(items=None): items = items or []"
      - "def f(items=list):"
      - "def f(items=()):"
    answer: 1
    explain: "A default argument is evaluated once, when the function is defined, so a literal [] is shared by every call that omits the argument. Building the list inside the body avoids that."

  - q: "What does `isinstance(True, int)` return?"
    options:
      - "True"
      - "False"
      - "None"
      - "A TypeError"
    answer: 0
    explain: "`bool` is a subclass of `int` in Python, which is also why `True + True` is 2."

  - q: "Given `nums = [1, 2, 3, 4]`, which produces `[2, 4]`?"
    options:
      - "[n for n in nums if n % 2 == 0]"
      - "[n % 2 == 0 for n in nums]"
      - "[n for n in nums if n / 2]"
      - "filter(nums, lambda n: n % 2)"
    answer: 0
    explain: "The condition goes after the `for` clause in a comprehension. The second option builds a list of booleans instead of filtering."

  - q: "What happens when a module is imported for the second time in one program run?"
    options:
      - "Its top-level code runs again"
      - "Python raises ImportError"
      - "The cached module object is reused and its top-level code does not run again"
      - "The module is reloaded only if its file changed on disk"
    answer: 2
    explain: "Imported modules are cached in `sys.modules`, so top-level code runs once per process. `importlib.reload` is what forces it to run again."
