# Final assessment — Data Analytics.
#
# Authoring rules are in tutorials.yaml. These questions are about what the
# libraries do to your data -- alignment, views versus copies, how missing
# values propagate -- because those are the things that silently produce a
# wrong number rather than an error.
module: data-analytics
title: Data Analytics — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "`a = np.array([1, 2, 3])`, then `b = a[:2]`, then `b[0] = 99`. What is `a`?"
    options:
      - "array([99, 2, 3])"
      - "array([1, 2, 3])"
      - "array([99, 2])"
      - "A ValueError is raised"
    answer: 0
    explain: "Basic slicing of an ndarray returns a view onto the same buffer, not a copy, so writing through the slice writes through to the original. `a[:2].copy()` breaks the link."

  - q: "Adding a Series indexed `['a','b','c']` to one indexed `['b','c','d']` produces a result with:"
    options:
      - "four entries, two of them NaN"
      - "three entries, added position by position"
      - "two entries, for the labels in both"
      - "a ValueError about mismatched lengths"
    answer: 0
    explain: "pandas aligns on the index before operating, so the result carries the union of labels and any label missing from one side becomes NaN. This is the behaviour that quietly turns a join mistake into a column of nulls."

  - q: "Which selects rows 0 and 1 of a DataFrame by position, regardless of what the index holds?"
    options:
      - "`df.iloc[0:2]`"
      - "`df.loc[0:2]`"
      - "`df[0:2:1]`"
      - "`df.take(0, 2)`"
    answer: 0
    explain: "`iloc` is positional; `loc` is label-based, and with an integer index `loc[0:2]` is inclusive of 2 and means labels rather than positions."

  - q: "`df.groupby(\"city\")[\"temp\"].mean()` treats NaN temperatures how?"
    options:
      - "Skips them; a group of all-NaN gives NaN"
      - "Treats them as zero"
      - "Raises a ValueError"
      - "Drops the whole row from every group"
    answer: 0
    explain: "pandas aggregations skip missing values by default (`skipna=True`), so a mean is over the present values only -- which is why a group's mean can be based on far fewer rows than it appears."

  - q: "A column of years imported from CSV arrives with dtype `object`. The most likely cause is:"
    options:
      - "some values are not parseable as numbers, so the column fell back to strings"
      - "pandas always reads the first column as object"
      - "the file had no header row"
      - "the column has more than 2^31 rows"
    answer: 0
    explain: "One stray value -- an empty string, \"N/A\", a footnote marker -- forces the whole column to object. `pd.to_numeric(col, errors=\"coerce\")` converts and marks the offenders NaN."

  - q: "Which merge keeps every row of the left frame and fills unmatched right-hand columns with NaN?"
    options:
      - "`pd.merge(left, right, how=\"left\", on=\"id\")`"
      - "`pd.merge(left, right, how=\"inner\", on=\"id\")`"
      - "`pd.merge(left, right, how=\"outer\", on=\"id\")`"
      - "`pd.concat([left, right], axis=1)`"
    answer: 0
    explain: "A left join preserves the left frame's rows. Inner keeps only matches, outer keeps both sides' unmatched rows, and `concat` on axis 1 glues by index position rather than matching a key."

  - q: "Why does `df[df[\"a\"] > 0][\"b\"] = 1` often fail to change `df`?"
    options:
      - "It assigns into a temporary object, not into df"
      - "Boolean masks are read-only in pandas"
      - "Column b must be numeric for assignment"
      - "The comparison returns NaN for missing values"
    answer: 0
    explain: "Chained indexing may operate on a copy; the write lands on that copy and is discarded. `df.loc[df[\"a\"] > 0, \"b\"] = 1` addresses the frame itself in one step."

  - q: "Broadcasting an array of shape (3, 1) with one of shape (1, 4) yields shape:"
    options:
      - "(3, 4)"
      - "(3, 1)"
      - "(1, 4)"
      - "A ValueError -- the shapes are incompatible"
    answer: 0
    explain: "Dimensions of size 1 stretch to match the other operand, so the result takes the larger size along each axis."

  - q: "A distribution's mean is far above its median. This most often indicates:"
    options:
      - "a right-skewed distribution, with a long tail of large values"
      - "a symmetric distribution"
      - "an error in the calculation"
      - "the data are normally distributed"
    answer: 0
    explain: "The mean follows extreme values while the median does not, so a gap between them points at the tail's direction. It is the reason incomes and response times are reported as medians."

  - q: "A correlation of 0.9 between ice-cream sales and drownings means:"
    options:
      - "the two move together; a shared cause such as hot weather is more plausible than either causing the other"
      - "ice-cream sales cause drownings"
      - "the correlation must be a computational error"
      - "one variable is a linear transformation of the other"
    answer: 0
    explain: "Correlation measures co-movement, not direction of influence. A confounder that drives both is the usual explanation, and is why an experiment or a control is needed before claiming cause."

  - q: "Resampling a daily time series with `df.resample(\"ME\").sum()` requires that:"
    options:
      - "the index is a DatetimeIndex"
      - "the frame is sorted by value"
      - "every day is present with no gaps"
      - "the column dtype is float64"
    answer: 0
    explain: "Resampling is a time-based groupby, so pandas needs a datetime index (or an explicit `on=` column) to know where the period boundaries fall. Gaps are fine -- they simply contribute nothing."

  - q: "Which statement about a boxplot is true?"
    options:
      - "The box spans the interquartile range, and the line inside it is the median"
      - "The box spans one standard deviation either side of the mean"
      - "The whiskers always reach the minimum and maximum"
      - "The width of the box is proportional to the sample size"
    answer: 0
    explain: "The box runs from the first to the third quartile with the median marked inside. Whiskers conventionally stop at 1.5 × IQR, and points beyond them are drawn individually as outliers."
