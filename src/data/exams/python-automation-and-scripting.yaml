# Format and house style: see tutorials.yaml.
module: python-automation-and-scripting
title: Automation and Scripting — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "Which is the most portable way to build the path `data/2024/report.csv` in a script that runs on Windows and Linux?"
    options:
      - "`\"data\\\\2024\\\\report.csv\"`"
      - "`\"data/\" + \"2024\" + \"/report.csv\"` on Windows only"
      - "`Path(\"data\") / \"2024\" / \"report.csv\"` using `pathlib`"
      - "`os.system(\"echo data/2024/report.csv\")`"
    answer: 2
    explain: "`pathlib` picks the right separator for the operating system and gives you path operations such as `exists()` and `.suffix`. Hard-coded separators break on the other platform."

  - q: "What does this code do?\n\n```python\nfor p in Path('.').glob('*.txt'):\n    p.rename(p.with_suffix('.md'))\n```"
    options:
      - "Renames every `.txt` file in the current folder to `.md`"
      - "Copies every `.txt` file to `.md`"
      - "Renames files in all subfolders"
      - "Deletes every `.txt` file"
    answer: 0
    explain: "`glob('*.txt')` matches files in the current directory only, and `with_suffix` produces the new name that `rename` applies. Subfolders would need `rglob`."

  - q: "A script opens `open('log.txt', 'w')` to add a line to an existing log. What goes wrong?"
    options:
      - "Nothing, `w` appends"
      - "The file is truncated, so earlier contents are lost; `'a'` should be used"
      - "It raises FileNotFoundError"
      - "The file becomes read-only"
    answer: 1
    explain: "Mode `w` creates or truncates the file on open. Append mode `a` writes at the end and preserves existing lines."

  - q: "Why is `subprocess.run([\"ls\", user_input])` safer than `subprocess.run(\"ls \" + user_input, shell=True)`?"
    options:
      - "It runs faster"
      - "It works only on Linux"
      - "It captures output automatically"
      - "The argument list is not parsed by a shell, so input like `; rm -rf ~` is treated as one plain argument"
    answer: 3
    explain: "With `shell=True` the string is interpreted by the shell, enabling command injection. Passing a list avoids shell interpretation."

  - q: "You want a script to be usable by importing its functions elsewhere without running the main logic. What pattern do you use?"
    options:
      - "Put everything at top level"
      - "Wrap the entry point in `if __name__ == \"__main__\":`"
      - "Name the file `main.py`"
      - "Call `exit()` at the end"
    answer: 1
    explain: "`__name__` equals `\"__main__\"` only when the file is run directly. On import the guarded block is skipped."

  - q: "Which tool best fits a script that needs `--input FILE`, an optional `--verbose` flag and generated `--help` output?"
    options:
      - "`input()`"
      - "Reading `sys.argv[1]` by hand"
      - "`argparse`"
      - "`os.environ`"
    answer: 2
    explain: "`argparse` declares arguments, validates them, and builds usage and help messages. Manual `sys.argv` handling quickly gets error prone."

  - q: "A nightly script calls a flaky web API that sometimes times out. What is the most robust approach?"
    options:
      - "Set a timeout and retry a limited number of times with increasing delay, logging failures"
      - "Call it in an infinite loop with no delay"
      - "Ignore errors with a bare `except: pass`"
      - "Remove the API call"
    answer: 0
    explain: "Timeouts prevent hangs, bounded retries with backoff handle transient failures politely, and logging keeps the problem visible. Swallowing all exceptions hides bugs."

  - q: "Where should a script read an API key from?"
    options:
      - "A string literal committed to the repository"
      - "The script's filename"
      - "A comment at the top of the file"
      - "An environment variable or an untracked config file"
    answer: 3
    explain: "Secrets in source control leak. Environment variables or ignored config files keep them out of the repository and easy to rotate."

  - q: "You must process a 5 GB CSV file on a laptop with 8 GB of RAM. Which approach is best?"
    options:
      - "`f.read()` the whole file first"
      - "Iterate over rows lazily with `csv.reader` or read in chunks"
      - "Convert the file to a list of lists first"
      - "Open it in write mode"
    answer: 1
    explain: "Iterating processes one row at a time with constant memory. Loading everything at once risks exhausting RAM."

  - q: "A cron job runs your script but fails with `FileNotFoundError` for `config.json`, although it works in the terminal. What is the likely cause?"
    options:
      - "cron cannot run Python"
      - "JSON files are not readable by cron"
      - "The working directory differs, so the relative path does not resolve; build it from `Path(__file__).parent`"
      - "The script is too long"
    answer: 2
    explain: "Schedulers start jobs from a different working directory. Anchoring paths to the script location or using absolute paths fixes it."

  - q: "Which is the best use of the `logging` module in a long-running automation script?"
    options:
      - "Replace every `print` with `input`"
      - "Encrypt output"
      - "Speed up loops"
      - "Record timestamped messages at levels such as INFO and ERROR to a file, so failures can be diagnosed later"
    answer: 3
    explain: "Logging gives levels, timestamps and configurable destinations, which unattended scripts need since no one watches the terminal."

  - q: "What is the value of `re.findall(r'\\d+', 'a1b22c333')`?"
    options:
      - "`['1', '22', '333']`"
      - "`['1', '2', '2', '3', '3', '3']`"
      - "`['a', 'b', 'c']`"
      - "`'333'`"
    answer: 0
    explain: "`\\d+` matches maximal runs of digits and `findall` returns each match as a string in order."
