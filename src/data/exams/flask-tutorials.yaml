# Final assessment — Flask.
#
# Authoring rules are in tutorials.yaml. Questions here test what the framework
# actually does at request time -- routing, the request/response cycle,
# templates, sessions -- rather than which decorator is spelled which way.
module: flask-tutorials
title: Flask — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "A view is declared as `@app.route(\"/user/<int:uid>\")`. What does Flask do with a request for `/user/abc`?"
    options:
      - "Returns 404 without calling the view"
      - "Calls the view with uid set to the string \"abc\""
      - "Calls the view with uid set to 0"
      - "Raises a 500 error from the converter"
    answer: 0
    explain: "The `int` converter is part of the matching rule, not a cast inside the view. A segment that will not convert simply does not match the rule, so no route matches and Flask returns 404."

  - q: "Why does `debug=True` belong in development only?"
    options:
      - "The interactive debugger can execute arbitrary code in the browser"
      - "It disables template rendering"
      - "It makes the development server multi-threaded"
      - "It stops Flask from reading configuration files"
    answer: 0
    explain: "The traceback page offers a console that runs Python on the server. On a public host that is remote code execution, which is why the PIN exists and why the flag still stays off in production."

  - q: "A form posts to a view. Which reads the submitted field named `email`?"
    options:
      - "`request.form[\"email\"]`"
      - "`request.args[\"email\"]`"
      - "`request.values.query[\"email\"]`"
      - "`request.data[\"email\"]`"
    answer: 0
    explain: "`form` holds the parsed body of a POST; `args` holds the query string. `request.data` is the raw body as bytes and is not subscriptable by field name."

  - q: "What does Jinja's autoescaping do to `{{ comment }}` when comment is `<b>hi</b>`?"
    options:
      - "Renders the text `<b>hi</b>` instead of bold markup"
      - "Renders bold text"
      - "Raises a TemplateError"
      - "Strips the tags and renders `hi`"
    answer: 0
    explain: "Autoescaping converts the angle brackets to entities, which is what keeps user input from becoming markup. `|safe` turns that off -- and is exactly where cross-site scripting gets in."

  - q: "Flask's `session` object stores its data:"
    options:
      - "in a cookie, signed with the app's secret key"
      - "in server memory, keyed by a session id"
      - "in the database configured by SQLALCHEMY_DATABASE_URI"
      - "in a file under the instance folder"
    answer: 0
    explain: "The default session is a signed cookie: the client holds the data and the signature stops it being edited. It is not encrypted, so the contents are readable by whoever holds the cookie."

  - q: "`url_for(\"profile\", uid=7)` is preferred over writing `\"/user/7\"` because:"
    options:
      - "the URL is rebuilt from the route, so changing the rule does not break links"
      - "it is faster than string concatenation"
      - "it escapes HTML in the result"
      - "it is required inside templates"
    answer: 0
    explain: "It builds the URL from the endpoint's rule, including any application root. Hard-coded paths quietly rot the moment a route changes."

  - q: "Which is a correct redirect after a successful POST?"
    options:
      - "`return redirect(url_for(\"index\"))`"
      - "`return url_for(\"index\")`"
      - "`redirect(\"index\")`"
      - "`return render_template(\"index.html\"), 302`"
    answer: 0
    explain: "`redirect()` builds a response with a Location header, and the view must return it. Returning the URL string sends the text of the URL as the page body."

  - q: "Blueprints exist to:"
    options:
      - "group related routes and resources into a component registered onto an app"
      - "run views asynchronously"
      - "define the database schema"
      - "cache rendered templates"
    answer: 0
    explain: "A blueprint collects routes, templates and static files, then gets registered on one or more apps, optionally under a URL prefix. It is organisation, not behaviour."

  - q: "A view returns `render_template(\"page.html\")` but the file sits in `app/pages/page.html`. What happens?"
    options:
      - "TemplateNotFound, because Jinja looks in the templates folder"
      - "The template renders normally"
      - "Flask copies the file into templates/ on first use"
      - "The file is served as a static file instead"
    answer: 0
    explain: "The template loader searches the app's `templates` directory (and each blueprint's). A path outside it is invisible unless the loader is configured to include it."

  - q: "Which response correctly returns JSON with a 201 status?"
    options:
      - "`return jsonify(item), 201`"
      - "`return json.dumps(item), 201`"
      - "`return jsonify(item, 201)`"
      - "`return 201, jsonify(item)`"
    answer: 0
    explain: "`jsonify` builds a response with the JSON content type; returning a (body, status) tuple sets the code. `json.dumps` returns a plain string, which Flask sends as text/html."

  - q: "`@app.errorhandler(404)` registers a function that:"
    options:
      - "runs whenever the app produces a 404, returning the replacement response"
      - "prevents 404s from occurring"
      - "only runs when a route raises NotFound explicitly"
      - "must return None"
    answer: 0
    explain: "The handler is called with the exception and returns the response to send instead -- typically a rendered template and the status code."

  - q: "Why is a production deployment run under Gunicorn or uWSGI rather than `flask run`?"
    options:
      - "The development server is single-process and not built to handle real traffic safely"
      - "`flask run` cannot serve static files"
      - "Templates are not cached by `flask run`"
      - "`flask run` only listens on IPv6"
    answer: 0
    explain: "Werkzeug's server is for development: it makes no promises about concurrency, robustness or security under load. A WSGI server manages worker processes and sits behind a real front end."
