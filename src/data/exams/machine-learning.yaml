# Final assessment — Machine Learning (ML 210).
# Format and house style: see tutorials.yaml.
module: machine-learning
title: Machine Learning — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "A model scores 99% accuracy on its training data but 71% on the test set. What is the most likely diagnosis?"
    options:
      - "Underfitting, because the model is too simple"
      - "Data leakage from the test set into training"
      - "Overfitting, because the model memorised training noise"
      - "The learning rate is too low"
    answer: 2
    explain: "A large gap between training and test performance means the model fits quirks of the training data that do not generalise. Regularisation, more data, or a simpler model are the usual remedies."

  - q: "You fit a `StandardScaler` on the full dataset and only then split into train and test. What is the problem?"
    options:
      - "Test-set statistics leak into preprocessing, so evaluation is optimistically biased"
      - "The scaler will raise an error on unseen data"
      - "Scaling before splitting changes the number of rows"
      - "There is no problem; scaling is unsupervised so it cannot leak"
    answer: 0
    explain: "The mean and standard deviation were computed using rows that should have been unseen. Fit preprocessing on the training split only (ideally inside a Pipeline) and just transform the test split."

  - q: "Only 1% of transactions in a dataset are fraudulent. A model that always predicts 'not fraud' would score 99% accuracy. Which metric is most informative here?"
    options:
      - "Accuracy"
      - "Mean squared error"
      - "R-squared"
      - "Precision and recall on the fraud class"
    answer: 3
    explain: "With heavy class imbalance accuracy rewards ignoring the minority class. Precision and recall on the rare class show whether fraud is actually being caught and how many alarms are false."

  - q: "Which situation calls for `OneHotEncoder` rather than `OrdinalEncoder` on a feature?"
    options:
      - "Shirt size with values S, M, L, XL"
      - "City with values Paris, Tokyo, Lima and no natural order"
      - "Education level from primary to doctorate"
      - "Star rating from 1 to 5"
    answer: 1
    explain: "Ordinal codes imply an order and distances between categories. For unordered categories like city, one-hot columns avoid inventing a false ranking."

  - q: "Two features are height in metres (about 1.7) and salary in dollars (about 60000). Which algorithm is most damaged by leaving them unscaled?"
    options:
      - "A decision tree"
      - "k-nearest neighbours"
      - "A random forest"
      - "Gradient boosted trees"
    answer: 1
    explain: "k-NN relies on raw distances, so the salary axis would dominate completely. Tree-based models split on one feature at a time and are insensitive to monotonic scaling."

  - q: "In linear regression, adding an L1 penalty (Lasso) rather than L2 (Ridge) tends to do what?"
    options:
      - "Increase every coefficient"
      - "Remove the need for a validation set"
      - "Make the model nonlinear"
      - "Drive some coefficients exactly to zero, performing feature selection"
    answer: 3
    explain: "The L1 penalty has corners at zero that make sparse solutions likely. L2 shrinks coefficients smoothly but rarely zeroes them."

  - q: "Why does a random forest usually generalise better than a single deep decision tree?"
    options:
      - "Averaging many decorrelated trees reduces variance"
      - "Each tree in a forest is shallower and so has lower bias"
      - "It trains on the test set as well"
      - "It removes the need for any hyperparameters"
    answer: 0
    explain: "Bootstrap sampling and random feature subsets make trees make different errors; averaging them cancels much of the noise, cutting variance while bias stays similar."

  - q: "You run k-means with k=3 on data that really has two well-separated blobs. What is the best way to check whether k=3 is sensible?"
    options:
      - "Compare training accuracy for each k"
      - "Compute silhouette scores or an elbow plot across several values of k"
      - "Check that the clusters have the same size"
      - "Use k equal to the number of features"
    answer: 1
    explain: "There are no labels in clustering, so you judge cohesion and separation. Silhouette score and inertia curves across values of k show which number of clusters the data supports."

  - q: "You tune hyperparameters with `GridSearchCV` and report its best cross-validation score as your final expected performance. What is wrong with this?"
    options:
      - "Cross-validation cannot be used with grid search"
      - "The score is computed on training data only"
      - "The reported score is optimistically biased because it was also used to choose the winner; a held-out test set is needed"
      - "Grid search always picks the simplest model"
    answer: 2
    explain: "Picking the maximum of many noisy estimates biases it upward. A final untouched test set (or nested cross-validation) gives an honest estimate."

  - q: "Which change to a logistic regression classifier moves the decision threshold from 0.5 to 0.2 to catch more positives?"
    options:
      - "It raises precision and lowers recall"
      - "It leaves both precision and recall unchanged"
      - "It typically raises recall at the cost of lower precision"
      - "It retrains the model with new weights"
    answer: 2
    explain: "A lower threshold labels more cases as positive, so more true positives are found but more false positives come with them. The model weights are unchanged."

  - q: "A model is deployed and its live accuracy slowly declines although the code has not changed. What is the most probable cause?"
    options:
      - "Model files degrade on disk over time"
      - "Python's garbage collector is discarding weights"
      - "Input data drift: the real-world distribution has moved away from the training data"
      - "The test set has become too small"
    answer: 2
    explain: "Models are static functions of their training distribution. When customer behaviour or upstream data changes, performance falls, which is why monitoring and retraining are part of MLOps."

  - q: "A SHAP summary shows the feature `zip_code` as the top driver of loan approvals. What responsible-ML concern should this prompt?"
    options:
      - "Zip code may act as a proxy for protected attributes, so fairness should be audited"
      - "SHAP values are invalid for categorical features"
      - "The model is underfitting"
      - "Zip code should always be one-hot encoded"
    answer: 0
    explain: "Location often correlates with race or income, so a model can discriminate indirectly without using a protected attribute. Interpretability tools help surface this and trigger a fairness check."
