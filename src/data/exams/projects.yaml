# Final assessment — Python Projects (PY 150).
# Format and house style: see tutorials.yaml.
module: projects
title: Python Projects — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "A to-do app stores tasks in `tasks.json`. Which pattern best avoids leaving the file corrupt if the program crashes mid-save?"
    options:
      - "Open the file with `'w'` and write directly each time"
      - "Write to a temporary file, then replace the original with `os.replace`"
      - "Append every save to the same file"
      - "Keep the data only in memory"
    answer: 1
    explain: "Writing to a temp file first means the original stays intact until a complete new version exists. The replace step is atomic on most systems."

  - q: "What is printed?\n\n```python\nimport json\ndata = json.loads('{\"n\": 3, \"tags\": [\"a\", \"b\"]}')\nprint(data[\"tags\"][-1], data[\"n\"] + 1)\n```"
    options:
      - "a 4"
      - "b 3"
      - "b 4"
      - "TypeError"
    answer: 2
    explain: "`json.loads` turns the string into a dict holding an int and a list. The last tag is `b`, and `3 + 1` is 4."

  - q: "A word-frequency counter must return the three most common words. Which structure is the best fit?"
    options:
      - "`collections.Counter` and `most_common(3)`"
      - "A tuple of words"
      - "A list with `.count()` called for each word"
      - "A set of words"
    answer: 0
    explain: "`Counter` tallies in one pass and `most_common` sorts by count. Calling `.count()` per word rescans the list each time and becomes slow."

  - q: "A CSV row is `'Ana,\"Paris, France\",30'`. Why does `row.split(',')` give wrong results?"
    options:
      - "`split` cannot handle commas"
      - "The row has too many characters"
      - "CSV files must use tabs"
      - "It splits inside the quoted field, producing four pieces; `csv.reader` respects quoting"
    answer: 3
    explain: "Quoted fields may contain the delimiter. The `csv` module parses quotes properly, while naive splitting does not."

  - q: "A program calls `int(input())` and crashes when the user types `abc`. What is the appropriate fix?"
    options:
      - "Wrap in `try/except ValueError` and ask again"
      - "Use `str()` instead"
      - "Catch `KeyError`"
      - "Use `global`"
    answer: 0
    explain: "`int('abc')` raises `ValueError`. Catching that specific exception in a loop lets the program re-prompt without hiding unrelated bugs."

  - q: "A game keeps a list of high scores and needs the top 5 quickly after each update. Which approach works?"
    options:
      - "Sort the whole list by hand with nested loops after every insert"
      - "Use `sorted(scores, reverse=True)[:5]` or `heapq.nlargest(5, scores)`"
      - "Store scores in a string"
      - "Use `scores.pop()` five times"
    answer: 1
    explain: "`sorted` with slicing or `heapq.nlargest` give the top values directly. `pop()` would just remove the last items, not the largest."

  - q: "You call `requests.get(url)` and get a response with status 404. What does `response.json()` most likely do?"
    options:
      - "Return the requested data anyway"
      - "Return `None`"
      - "Retry the request"
      - "Raise an error if the body is not valid JSON, so check `raise_for_status()` or `status_code` first"
    answer: 3
    explain: "A 404 is a successful HTTP exchange, not a Python exception, and its body is often HTML. Always check the status before parsing."

  - q: "A function has a mutable default: `def add(item, bucket=[]): bucket.append(item); return bucket`. What happens on `add(1)` then `add(2)`?"
    options:
      - "`[1]` then `[2]`"
      - "`[1]` then `[1, 2]`, because the default list is created once and shared"
      - "TypeError on the second call"
      - "`[2]` then `[2]`"
    answer: 1
    explain: "Default values are evaluated once at definition time. Use `bucket=None` and create a new list inside the function."

  - q: "A contact book needs fast lookup by name. Which structure gives average constant-time access?"
    options:
      - "A list of tuples scanned linearly"
      - "A sorted string"
      - "A dict keyed by name"
      - "A nested for loop"
    answer: 2
    explain: "Dicts are hash tables, so looking up a key takes roughly constant time regardless of size. Scanning a list is linear."

  - q: "A loop prints `0 1 2` but you expected `1 2 3`:\n\n```python\nfor i in range(3):\n    print(i)\n```\nWhat change gives the expected output?"
    options:
      - "`range(1, 4)`"
      - "`range(1, 3)`"
      - "`range(3, 1)`"
      - "`range(4)`"
    answer: 0
    explain: "`range(start, stop)` excludes stop, so `range(1, 4)` yields 1, 2, 3. `range(1, 3)` stops at 2."

  - q: "A script raises `KeyError: 'email'` for some records in a parsed JSON list. What is the most sensible handling?"
    options:
      - "Wrap the whole program in `except Exception: pass`"
      - "Delete the records"
      - "Read with `record.get('email')` and handle the missing case explicitly"
      - "Convert the dict to a string"
    answer: 2
    explain: "Some records lack the key, so use `get` (or check `in`) and decide what a missing value means. Silencing all exceptions hides real problems."

  - q: "When debugging a function that returns a wrong total, which technique is the most effective first step?"
    options:
      - "Rewrite the whole function"
      - "Restart the computer"
      - "Add more features"
      - "Print or inspect intermediate values, or step through with a debugger, to find where the value first diverges"
    answer: 3
    explain: "Locating the first point where actual and expected values differ narrows the bug to a few lines, which is faster than guessing or rewriting."
