# Final assessment — Deep Learning (DL 310).
# Format and house style: see tutorials.yaml.
module: deep-learning
title: Deep Learning — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "A deep network uses sigmoid activations in every hidden layer and its early layers barely learn. What is the likely cause?"
    options:
      - "Vanishing gradients, since sigmoid derivatives are at most 0.25 and shrink as they multiply through layers"
      - "The batch size is too large"
      - "Sigmoid outputs are negative, breaking backpropagation"
      - "There are too few parameters"
    answer: 0
    explain: "Backpropagation multiplies local derivatives layer by layer. With sigmoid these are small, so the gradient reaching early layers collapses. ReLU-style activations and good initialisation help."

  - q: "In PyTorch, a training loop forgets to call `optimizer.zero_grad()`. What happens?"
    options:
      - "Gradients are reset automatically each step, so nothing changes"
      - "Training stops with a RuntimeError"
      - "Weights are reset to their initial values"
      - "Gradients accumulate across batches, so updates use a sum of old and new gradients"
    answer: 3
    explain: "PyTorch adds new gradients into the `.grad` buffers by default. Without zeroing, each update is polluted by earlier batches, which behaves like an unintended, ever-growing batch."

  - q: "Which output layer and loss pair suits a 10-class single-label image classifier?"
    options:
      - "One sigmoid unit and mean squared error"
      - "Ten logits and cross-entropy loss"
      - "Ten ReLU units and hinge loss on pixels"
      - "One linear unit and binary cross-entropy"
    answer: 1
    explain: "Ten logits feed softmax cross-entropy, which models a distribution over mutually exclusive classes. In PyTorch `CrossEntropyLoss` applies log-softmax itself, so raw logits are passed."

  - q: "Training loss keeps falling while validation loss starts rising after epoch 12. Which response is most appropriate?"
    options:
      - "Increase the learning rate"
      - "Train for many more epochs"
      - "Remove the validation set"
      - "Use early stopping, dropout, or data augmentation"
    answer: 3
    explain: "Diverging curves signal overfitting. Early stopping halts near the validation optimum and dropout or augmentation reduce the model's ability to memorise."

  - q: "Why do convolutional layers suit images better than fully connected layers on raw pixels?"
    options:
      - "They have more parameters, so they memorise better"
      - "They reuse small filters across positions, exploiting local structure and cutting parameters"
      - "They ignore spatial neighbourhoods"
      - "They only work on grayscale inputs"
    answer: 1
    explain: "Weight sharing gives translation-equivariant feature detection with far fewer parameters than a dense layer connected to every pixel."

  - q: "A 32x32 input goes through a 3x3 convolution with stride 1 and no padding. What is the output height and width?"
    options:
      - "32x32"
      - "31x31"
      - "30x30"
      - "16x16"
    answer: 2
    explain: "Output size is (input - kernel) / stride + 1 = (32 - 3) / 1 + 1 = 30. Padding of 1 would preserve 32."

  - q: "You have only 800 labelled images for a new task. Which approach is usually best?"
    options:
      - "Fine-tune a network pre-trained on a large dataset such as ImageNet"
      - "Train a very deep network from random initialisation"
      - "Use a fully connected network on flattened pixels"
      - "Skip validation because the dataset is small"
    answer: 0
    explain: "Pre-trained features such as edges and textures transfer well. Fine-tuning needs far less data than learning them from scratch."

  - q: "Why is an LSTM often preferred over a plain RNN for long sequences?"
    options:
      - "It has no recurrent connections"
      - "It processes all time steps in parallel"
      - "Its gated cell state lets gradients and information persist across many steps"
      - "It needs no training"
    answer: 2
    explain: "Input, forget and output gates control a cell state that carries information with additive updates, easing the vanishing-gradient problem of plain RNNs."

  - q: "What key idea lets Transformers replace recurrence for language modelling?"
    options:
      - "Convolutions over characters"
      - "Bag-of-words counts"
      - "Random word dropping"
      - "Self-attention, where each token weighs all other tokens in the sequence in parallel"
    answer: 3
    explain: "Attention lets any position access any other directly, with computation parallel across positions. Positional encodings restore word order information."

  - q: "In a GAN, the discriminator becomes far stronger than the generator early on and the generator stops improving. Why?"
    options:
      - "The generator has no loss function"
      - "The discriminator's confident rejections give the generator little useful gradient signal"
      - "GANs are supervised so labels ran out"
      - "The latent vector is too small to sample"
    answer: 1
    explain: "Training is a balance. When the discriminator wins too easily the generator's feedback saturates, so techniques such as balanced updates or alternative losses are used."

  - q: "In Q-learning, what does the discount factor gamma close to 0 make the agent do?"
    options:
      - "Value long-term rewards as much as immediate ones"
      - "Ignore rewards entirely"
      - "Act randomly at every step"
      - "Focus almost entirely on immediate reward"
    answer: 3
    explain: "Gamma weights future rewards geometrically. Near zero, future terms vanish and the agent is short-sighted; near one, it plans far ahead."

  - q: "Before serving a trained PyTorch model for inference, which two calls are standard?"
    options:
      - "`model.train()` and `optimizer.step()`"
      - "`model.eval()` and `torch.no_grad()`"
      - "`model.zero_grad()` and `loss.backward()`"
      - "`model.fit()` and `model.save()`"
    answer: 1
    explain: "Eval mode turns off dropout and uses running batch-norm statistics, while `no_grad` skips gradient tracking to save memory and time."
