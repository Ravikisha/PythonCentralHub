# Final assessment — DSA with Python.
#
# Same shape as tutorials.yaml; see that file for the authoring rules. The
# short version: answer is a zero-based index, questions test whether the
# reader can reason about a structure's cost and behaviour rather than recall a
# definition, and `explain` must not leak another question's answer.
#
# Complexity questions state the operation precisely ("append to the end",
# "insert at index 0") because "is a list fast?" has no answer.
module: dsa-with-python
title: DSA with Python — final assessment
passScore: 70
timeLimitMinutes: 25

questions:
  - q: "A Python list holds one million items. Which operation is O(n) rather than O(1)?"
    options:
      - "`items.insert(0, x)`"
      - "`items.append(x)`"
      - "`items[500_000]`"
      - "`items.pop()`"
    answer: 0
    explain: "Inserting at the front shifts every later element one slot along. Appending, indexing and popping the last item touch one end only, which is why a deque exists for queues."

  - q: "You need to test membership 100,000 times against a fixed collection of 50,000 strings. Which gives the best asymptotic cost per test?"
    options:
      - "A `set`"
      - "A sorted `list` with `in`"
      - "A `list` with `in`"
      - "A `tuple` with `in`"
    answer: 0
    explain: "A set hashes the value and looks in one bucket: O(1) on average. `in` over any sequence scans it, O(n) per test, and sorting the list does not change what `in` does."

  - q: "What is the worst-case time of binary search on a sorted array of n items?"
    options:
      - "O(log n)"
      - "O(1)"
      - "O(n)"
      - "O(n log n)"
    answer: 0
    explain: "Each comparison discards half the remaining range, so the number of steps is how many times n can be halved."

  - q: "Breadth-first search finds the shortest path in an unweighted graph because it:"
    options:
      - "visits every node at distance k before any node at distance k + 1"
      - "always follows the lowest-numbered neighbour first"
      - "keeps a priority queue ordered by edge weight"
      - "marks nodes visited as soon as they are dequeued"
    answer: 0
    explain: "The queue expands the frontier one layer at a time, so the first time a node is reached it is reached by a shortest path. Ordering by edge weight is Dijkstra's, which is what you need once edges differ in cost."

  - q: "A recursive function on a linked list of 50,000 nodes fails with RecursionError. The most direct fix is to:"
    options:
      - "rewrite the traversal as a loop"
      - "add `@lru_cache` to the function"
      - "convert the list to a Python `list` first"
      - "make the recursive call the last statement in the function"
    answer: 0
    explain: "CPython does not eliminate tail calls, so making the call last changes nothing; the stack limit is the constraint. An explicit loop uses no call stack at all."

  - q: "What does a min-heap guarantee about the value at index 0 of its array?"
    options:
      - "It is the smallest value in the heap"
      - "The array is fully sorted ascending"
      - "It is the most recently pushed value"
      - "It is the median of the values"
    answer: 0
    explain: "The heap property only orders each parent against its children, which is enough to keep the minimum at the root. A heap array is not sorted -- that is what makes push and pop O(log n)."

  - q: "Two strings are anagrams if they use the same letters with the same counts. Which approach runs in O(n) time?"
    options:
      - "Compare `Counter(a)` with `Counter(b)`"
      - "Compare `sorted(a)` with `sorted(b)`"
      - "Check `set(a) == set(b)`"
      - "Check whether every character of `a` is `in b`"
    answer: 0
    explain: "Counting is one pass over each string. Sorting is O(n log n), sets lose the counts (\"aab\" and \"abb\" would match), and the membership check is O(n²) and also ignores counts."

  - q: "A hash table's average O(1) lookup degrades to O(n) when:"
    options:
      - "many keys collide into the same bucket"
      - "the table is more than half empty"
      - "the keys are inserted in sorted order"
      - "the values stored are large objects"
    answer: 0
    explain: "Lookup cost is the length of the chain being searched. Collisions concentrate keys into one chain; the value's size and the insertion order of keys do not affect where they hash."

  - q: "Which statement about dynamic programming is true?"
    options:
      - "It applies when subproblems overlap and their solutions can be reused"
      - "It always uses less memory than the recursive version"
      - "It requires the problem to be solvable greedily"
      - "It only works on problems with integer inputs"
    answer: 0
    explain: "Overlapping subproblems plus optimal substructure are the conditions. A DP table often costs more memory than plain recursion -- that is the trade being made for time."

  - q: "You must return the k largest of n numbers, where k is small and n is huge. The best approach is:"
    options:
      - "keep a min-heap of size k while scanning once"
      - "sort all n numbers and take the last k"
      - "call `max()` k times, removing the winner each time"
      - "put everything in a set and sort that"
    answer: 0
    explain: "The heap scan is O(n log k) with O(k) memory. Sorting everything is O(n log n), repeated `max()` is O(nk), and a set both loses duplicates and still has to be sorted."

  - q: "In a stack-based bracket matcher, an unmatched closing bracket is detected when:"
    options:
      - "a closing bracket arrives and the stack is empty"
      - "the stack is non-empty after the whole string is read"
      - "two closing brackets appear in a row"
      - "the string has an odd number of characters"
    answer: 0
    explain: "An empty stack means nothing is open to close. A non-empty stack at the end is the other failure -- an unmatched opening bracket -- and both checks are needed."

  - q: "Union-Find with path compression and union by rank is used to:"
    options:
      - "track which elements belong to the same set as merges happen"
      - "keep a set of elements sorted as they are inserted"
      - "find the shortest path between two nodes"
      - "detect the largest element in a stream"
    answer: 0
    explain: "It answers \"are these two in the same component?\" and merges components, in near-constant amortised time. That is what makes Kruskal's algorithm and cycle detection in an undirected graph cheap."
