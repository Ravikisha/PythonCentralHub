# =============================================================================
# Company profiles for the interview-prep track.
#
# READ THIS BEFORE TRUSTING THE TAGS
# ----------------------------------
# Per-company problem tags are crowd-reported, not published. Companies do not
# release their question banks; every "asked at X" list in circulation — here or
# anywhere else — is aggregated from candidate reports, is months to years stale,
# and is biased toward whoever bothered to post. So:
#
#   * `<CompanyBoard>` labels its tables "reported", never "asked".
#   * Round structures below are the reliable part — companies publish those,
#     and recruiters confirm them. Treat those as accurate.
#   * `patterns` is the useful signal: which *pattern families* a company leans
#     on is far more stable than which individual problems it uses.
#
# Prepare by pattern. Use the tags to choose an order, never as a question bank.
# =============================================================================

google:
  name: Google
  slug: google
  blurb: >
    The most algorithm-purist of the big five. Expect a clean problem, then
    layers of follow-ups that keep tightening the constraints until you are
    designing rather than recalling.
  rounds:
    - name: "Phone screen"
      count: "1"
      minutes: "45"
      focus: "One medium, coded in a shared doc or CoderPad"
    - name: "Onsite coding"
      count: "2-3"
      minutes: "45"
      focus: "Medium to hard, heavy on follow-up laddering"
    - name: "Googlyness & leadership"
      count: "1"
      minutes: "45"
      focus: "Behavioural, collaboration, ambiguity"
    - name: "System design"
      count: "1"
      minutes: "45"
      focus: "L5 and above only"
  bar: >
    Scores are on a 1-4 scale per interviewer and go to an independent hiring
    committee that never met you — so your interviewer's notes are the only
    evidence. Narrate constantly; unexplained correct code scores worse than
    explained near-miss code.
  patterns:
    - graph-traversal-and-connected-components
    - binary-search-on-answer
    - two-dimensional-dp-and-knapsack
    - tries
    - sliding-window
    - monotonic-stack
    - shortest-paths-dijkstra-bellman-ford-and-floyd-warshall
  quirks:
    - The follow-up ladder is the real interview. Getting the first solution fast buys you harder questions, not an early finish.
    - Complexity analysis is graded explicitly. State time and space before you are asked, every time.
    - Expect "now make it O(1) space" or "now the input is a stream" on almost every problem.
    - Hiring committee review means the process is slow. Weeks between onsite and offer is normal, not a bad sign.

meta:
  name: Meta
  slug: meta
  blurb: >
    Speed and volume. Two problems in 35-40 minutes of coding time is the
    signature format, so a pattern you have to derive from scratch will cost you
    the round even if you get there.
  rounds:
    - name: "Phone screen"
      count: "1"
      minutes: "45"
      focus: "Two mediums back to back"
    - name: "Coding (onsite)"
      count: "2"
      minutes: "45"
      focus: "Two problems each, mediums with one hard"
    - name: "Behavioural (\"Jedi\")"
      count: "1"
      minutes: "45"
      focus: "Conflict, ownership, moving fast"
    - name: "System design"
      count: "1"
      minutes: "45"
      focus: "E5 and above"
  bar: >
    Interviewers are looking for a working solution plus a stated complexity
    inside ~20 minutes per problem. Optimal-first matters more here than
    anywhere else — there is no time to iterate from brute force.
  patterns:
    - two-pointers
    - tree-dfs-paths-and-sums
    - binary-search-template-and-variants
    - hash-tables
    - grid-traversal-islands-and-flood-fill
    - one-dimensional-dp
    - stack-parsing-and-expression-evaluation
  quirks:
    - Budget 20 minutes per problem and say so out loud. Ask which problem to start with if given a choice.
    - Meta reuses a comparatively small rotation of problems; the "top 50 Meta-tagged" lists have unusually high hit rates.
    - Clarify input assumptions in one sentence, not five. Over-clarifying eats the clock you cannot spare.
    - You are hired to the company, then matched to a team afterwards, so breadth beats depth in any one domain.

amazon:
  name: Amazon
  slug: amazon
  blurb: >
    Half the interview is not code. Every round pairs a technical problem with
    Leadership Principle questions, and the LP answers are scored with the same
    weight — a strong coder with weak LP stories does not pass.
  rounds:
    - name: "Online assessment"
      count: "1"
      minutes: "105"
      focus: "2 problems auto-graded, plus a work-simulation section"
    - name: "Phone screen"
      count: "1"
      minutes: "60"
      focus: "One medium plus LP questions"
    - name: "Loop"
      count: "4-5"
      minutes: "60"
      focus: "Each round is coding plus 2 LP questions"
    - name: "Bar Raiser"
      count: "1"
      minutes: "60"
      focus: "An interviewer from outside the team who can veto"
  bar: >
    Answer LP questions in STAR form with concrete numbers, and never reuse a
    story across rounds — interviewers compare notes. Prepare at least eight
    distinct stories mapped to the sixteen principles.
  patterns:
    - hash-tables
    - tree-bfs-and-level-order
    - grid-traversal-islands-and-flood-fill
    - top-k-elements
    - merge-intervals
    - greedy-interval-scheduling
    - design-lru-and-lfu-caches
  quirks:
    - The online assessment is auto-graded on hidden tests only, so brute force that TLEs scores zero. Optimise before submitting.
    - Expect graph-on-a-grid and top-K problems more than pure DP.
    - The Bar Raiser has veto power and is deliberately not on the hiring team. Treat that round as the most important one.
    - "\"Customer Obsession\" and \"Dive Deep\" come up most often. Have two stories ready for each."

microsoft:
  name: Microsoft
  slug: microsoft
  blurb: >
    The most conversational of the big five, and the most likely to care about
    code quality rather than just correctness. Expect discussion of edge cases,
    naming and testability.
  rounds:
    - name: "Recruiter + technical screen"
      count: "1"
      minutes: "60"
      focus: "One medium, often with a design flavour"
    - name: "Onsite"
      count: "3-4"
      minutes: "60"
      focus: "Coding plus practical design and past-project depth"
    - name: "As-appropriate (\"AA\") round"
      count: "1"
      minutes: "60"
      focus: "Senior interviewer, broad and decisive"
  bar: >
    Write code you would submit in a pull request: named variables, guarded
    edges, and a stated test plan. "How would you test this?" is asked far more
    often here than elsewhere.
  patterns:
    - linked-lists
    - binary-trees-and-bst
    - strings
    - design-with-stacks-and-queues
    - matrix-and-grid-manipulation
    - one-dimensional-dp
  quirks:
    - Expect to be asked to walk your own code through a test case line by line.
    - Real-world framing is common ("this array is a log of requests"), so restate the problem in plain terms first.
    - Deep questions about your own past projects are standard. Have one project you can defend at architecture level.

apple:
  name: Apple
  slug: apple
  blurb: >
    The least standardised process of the five — the team you are interviewing
    with matters more than the company. Some teams run classic algorithms, others
    run domain-specific systems questions.
  rounds:
    - name: "Recruiter + hiring manager"
      count: "1-2"
      minutes: "30-45"
      focus: "Fit and domain background"
    - name: "Technical"
      count: "3-5"
      minutes: "45-60"
      focus: "Varies sharply by team; often language internals plus algorithms"
    - name: "Cross-functional"
      count: "1-2"
      minutes: "45"
      focus: "Collaboration with adjacent teams"
  bar: >
    Ask the recruiter what the team's interviews actually cover — at Apple that
    question gets a real answer, and preparing for the wrong thing is the main
    failure mode.
  patterns:
    - linked-lists
    - strings
    - design-iterators-and-flatteners
    - bit-manipulation-tricks
    - binary-search-template-and-variants
    - simulation-and-stateful-iteration
  quirks:
    - Language and memory-model internals come up more than at other companies. Be ready to discuss how Python objects are laid out.
    - Some teams ask no LeetCode at all and go straight to domain design. Others are pure algorithms. Confirm in advance.
    - Secrecy is real — expect little detail about what you would work on until late in the process.

netflix:
  name: Netflix
  slug: netflix
  blurb: >
    Hires senior and above almost exclusively, and weights real engineering
    judgement far above puzzle-solving. The algorithm bar is real but secondary
    to how you reason about systems and trade-offs.
  rounds:
    - name: "Recruiter + hiring manager"
      count: "2"
      minutes: "45"
      focus: "Seniority, autonomy, culture-memo alignment"
    - name: "Technical"
      count: "2-3"
      minutes: "60"
      focus: "Practical coding, often on a realistic problem rather than a puzzle"
    - name: "Deep dive"
      count: "1-2"
      minutes: "60"
      focus: "Architecture and past decisions in detail"
  bar: >
    Explain trade-offs you rejected, not just the design you chose. The culture
    memo's "candour" is applied to interviews too — hedging reads badly.
  patterns:
    - hash-tables
    - design-trackers-and-feeds
    - top-k-elements
    - simulation-and-stateful-iteration
    - sorting-with-custom-comparators
  quirks:
    - Very few rounds, each with high weight. There is little room to recover from one bad round.
    - Expect open-ended problems with no single right answer, judged on how you narrow them.
    - Compensation is single-figure salary with no equity refresh cycle, so negotiation dynamics differ from the rest.

uber:
  name: Uber
  slug: uber
  blurb: >
    Strong bias toward problems with a geographic or scheduling flavour — graphs
    on maps, intervals over time, matching supply to demand.
  rounds:
    - name: "Online assessment"
      count: "1"
      minutes: "60-90"
      focus: "2 auto-graded problems"
    - name: "Technical screen"
      count: "1"
      minutes: "45"
      focus: "One medium"
    - name: "Onsite"
      count: "3-4"
      minutes: "45-60"
      focus: "Coding, plus system design at senior levels"
  bar: >
    Model the problem before coding it. Uber's questions often hide a standard
    algorithm behind a domain story, and naming the algorithm out loud is half
    the answer.
  patterns:
    - shortest-paths-dijkstra-bellman-ford-and-floyd-warshall
    - merge-intervals
    - sweep-line-and-event-counting
    - grid-traversal-islands-and-flood-fill
    - top-k-elements
    - greedy-interval-scheduling
  quirks:
    - Interval and sweep-line problems appear far above their base rate. Drill Phase 07 specifically.
    - Expect "now it must run in real time on a million drivers" as a follow-up.

bloomberg:
  name: Bloomberg
  slug: bloomberg
  blurb: >
    The most object-oriented-design-heavy of the common targets. Expect at least
    one round that is class design rather than an algorithm, and expect follow-ups
    about extending your design.
  rounds:
    - name: "Phone screen"
      count: "1"
      minutes: "45"
      focus: "One or two mediums"
    - name: "Onsite / virtual loop"
      count: "2-3"
      minutes: "60"
      focus: "Coding plus an explicit OOD round"
    - name: "Team match + manager"
      count: "1"
      minutes: "45"
      focus: "Fit and domain interest"
  bar: >
    Design rounds are graded on extensibility. Sketch the classes and their
    responsibilities before writing a method body, and say which requirement each
    class exists to serve.
  patterns:
    - design-with-stacks-and-queues
    - design-lru-and-lfu-caches
    - design-iterators-and-flatteners
    - linked-lists
    - hash-tables
    - strings
    - tries
  quirks:
    - The OOD round is close to guaranteed. Practise the parking-lot / elevator / deck-of-cards family, not just algorithms.
    - Financial-data framing is common (tickers, order books, time series) but the underlying structures are standard.
    - Follow-ups are about change, not scale — "now support a second currency" rather than "now a billion users".

bytedance:
  name: ByteDance / TikTok
  slug: bytedance
  blurb: >
    The hardest pure-algorithm bar of the group, and the closest to competitive
    programming. Hard-tier DP, string algorithms and advanced data structures
    appear at frequencies the other companies do not approach.
  rounds:
    - name: "Online assessment"
      count: "1"
      minutes: "90-120"
      focus: "3-4 problems, contest-style difficulty"
    - name: "Technical"
      count: "3-4"
      minutes: "60"
      focus: "Two problems per round, mediums and hards"
    - name: "HR / cross"
      count: "1"
      minutes: "30-45"
      focus: "Fit and motivation"
  bar: >
    Treat preparation as competitive programming rather than interview prep.
    Segment trees, string hashing and non-obvious DP states are in scope.
  patterns:
    - segment-trees-and-lazy-propagation
    - advanced-dp-optimizations
    - string-algorithms-kmp-z-and-rabin-karp
    - bitmask-and-tree-dp
    - binary-search-on-answer
    - monotonic-deque
    - number-theory-for-competitive-programming
  quirks:
    - The online assessment is genuinely contest-difficulty and is the main filter. Practise under time pressure.
    - Phases 16 and 17 of this course are not optional here, unlike at the other companies.
    - Multiple rounds may run on the same day with little gap. Stamina matters.
