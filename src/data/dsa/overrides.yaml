# =============================================================================
# Hand-curated corrections, keyed by slug.
#
# WHY THIS FILE EXISTS
# --------------------
# problems.yaml is generated: scripts/extract-problems.mjs harvests what the
# corpus already states, and scripts/merge-sheets.mjs folds in sheet membership.
# Anything a human knows that neither source can supply belongs here instead, so
# that regenerating never destroys it.
#
# merge-sheets.mjs applies this file LAST, so every key here wins outright.
# Setting `review: null` removes the "unverified" flag.
#
# Fields you will typically set:
#   lc          for problems created from a sheet title (they arrive with lc: null)
#   difficulty  the real tier, not the "medium" default
#   premium     LeetCode Premium problems, so the page can warn before you click
#   patterns    when the sheet-section guess is wrong
#   companies   crowd-reported tags — see the caveat in companies.yaml
#   freq        1-5 reported frequency
# =============================================================================

