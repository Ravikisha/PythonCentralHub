        text: "`notify` on a shared condition can stall everything"
      - kind: "cloze"
        label: "____ — H2O needs both — permits alone let the next molecule interleave. A barrier rearms after tripping."
        text: "`Barrier(n)` for grouping, semaphores for ratio."
      - kind: "cloze"
        label: "____ — measured 0 meals, 5 threads stuck. Not slow — stopped."
        text: "Left-then-right forks deadlock"
      - kind: "aspect"
        label: "Resource ordering breaks it"
        text: "by making philosopher 4 take fork 0 first, destroying the cycle. Waiter semaphore (`n − 1` diners) also works. Both: 5 meals, nothing stuck."
      - kind: "cloze"
        label: "____ — mutual exclusion (not removable) · hold-and-wait (waiter) · no-preemption (timeouts) · circular wait (ordering). Kill one and deadlock cannot happen."
