      - kind: "cloze"
        label: "____ — running, not progressing. Randomise backoff."
        text: "Timeout-and-retry risks livelock"
      - kind: "cloze"
        label: "____ — A cycle with nothing moving, versus one thread never served while others progress."
        text: "Deadlock is not starvation."
      - kind: "fact"
        label: "Bounded Buffers and Deadlock — recall the point"
        text: "The real-world rule: acquire locks in a globally consistent order and document it."
      - kind: "cloze"
        label: "____ — this design, in C, tested."
        text: "In production use `queue.Queue(maxsize=n)`"
      - kind: "aspect"
        label: "Test with `join(timeout)`"
        text: "so a deadlock fails instead of hanging."
