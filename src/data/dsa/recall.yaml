        label: "Cue"
        text: "the problem says binary search tree, or asks for something ordered (k-th smallest, closest value, range sum, predecessor) in a tree."
      - kind: "aspect"
        label: "Fact 1"
        text: "in-order is a sorted walk. Every sorted-array technique transfers. Use the iterative form so you can stop early."
      - kind: "aspect"
        label: "Fact 2"
        text: "descend by comparison. `root = root.left if val < root.val else root.right`; O(h) time, O(1) space, no recursion."
      - kind: "aspect"
        label: "Validation"
        text: "inherited bounds, not parent comparisons: `valid(node, low, high)` tightening one side per descent. Or: in-order must be strictly increasing."
      - kind: "aspect"
        label: "Cost"
        text: "everything is O(h): O(\\log n) balanced, O(n) degenerate. Never say O(\\log n) unqualified."
      - kind: "aspect"
        label: "`while stack or node`"
        text: "the stack keeps the walk alive after a node with no right child."
      - kind: "aspect"
        label: "Follow-up"
        text: "frequent modifications plus frequent k-th queries → store subtree sizes and descend in O(h)."
  - id: "lowest-common-ancestor"
    title: "Lowest Common Ancestor"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/lowest-common-ancestor/"
    patterns: ["lowest-common-ancestor", "tree-dfs-paths-and-sums", "meta", "amazon", "microsoft", "apple"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"lowest common ancestor\", or any \"where do these two paths meet\" question in a tree."
      - kind: "aspect"
        label: "General tree"
        text: "return `root` if it is `p` or `q`; recurse both sides; both sides non-`None` → this node is the LCA; otherwise `return left or right`."
      - kind: "cloze"
        label: "____ — `None` (neither here), `p`/`q` (only one here), the LCA (both here)."
        text: "Return value means three things"
      - kind: "aspect"
        label: "BST"
        text: "descend: both smaller → left, both larger → right, else this is the split point. O(h) time, O(1) space."
      - kind: "aspect"
        label: "Compare identity"
        text: "(`is`), never values — duplicates break value comparison."
      - kind: "cloze"
        label: "____ — returning `p` on sight is only valid because `q` is known to be in the tree (contrast LC 1644)."
        text: "The existence guarantee is load-bearing"
      - kind: "aspect"
        label: "Deepest leaves"
        text: "(LC 1123) — return `(depth, lca)`; a depth tie means this node is the answer."
      - kind: "aspect"
        label: "Many queries"
        text: "binary lifting, O(\\log n) per query after O(n \\log n) preprocessing."
  - id: "morris-traversal-and-o-1-space-tree-walks"
    title: "Morris Traversal and O(1)-Space Tree Walks"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/morris-traversal-and-o-1-space-tree-walks/"
    patterns: ["morris-traversal-and-o1-space-tree-walks", "tree-dfs-paths-and-sums", "bst-patterns", "binary-trees-and-bst", "google", "amazon", "microsoft", "bloomberg"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"O(1) extra space\" asked of a tree traversal, or a follow-up to the stack version."
      - kind: "aspect"
        label: "Idea"
        text: "store the return path in the tree: thread the in-order predecessor's null right pointer up to the current node."
      - kind: "aspect"
        label: "Loop"
        text: "no left child → visit, go right. Left child → find rightmost of the left subtree; if its right is null, thread it and descend left; if it is `cur`, cut the thread, visit, go right."
      - kind: "aspect"
        label: "Two arrivals"
        text: "every node with a left child is reached twice: install, then consume. In-order visits on the second, pre-order on the first."
      - kind: "aspect"
        label: "Cost"
        text: "O(n) time (each edge walked a constant number of times), O(1) extra space."
      - kind: "aspect"
        label: "Caveats"
        text: "the tree has cycles mid-walk; an early exit leaves it corrupt; unsafe with concurrent readers."
      - kind: "aspect"
        label: "Ladder"
        text: "LC 94 (the base), LC 99 (compare with the previous value), LC 114 (the same rewiring, made permanent)."
  - id: "serialize-compare-and-subtree"
    title: "Serialize Compare and Subtree"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/serialize-compare-and-subtree/"
    patterns: ["serialize-compare-and-subtree", "tree-dfs-paths-and-sums", "tree-bfs-and-level-order", "meta", "amazon", "google", "bloomberg"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "comparing two trees, encoding a tree as a string, or asking whether one tree appears inside another."
      - kind: "aspect"
        label: "Equality"
        text: "three guards in order: both empty → `True`; one empty or values differ → `False`; else recurse both sides. O(\\min(n, m))."
      - kind: "aspect"
        label: "Serialisation"
        text: "pre-order plus a `#` for every empty child, comma-separated. Exactly 2n + 1 tokens, regardless of shape."
      - kind: "aspect"
        label: "Deserialisation"
        text: "`tokens = iter(data.split(\",\"))` and consume with `next()`, in the same order; the iterator is the position."
      - kind: "aspect"
        label: "Markers are mandatory"
        text: "without them `[1,2]` and `[1,null,2]` are the same string."
      - kind: "aspect"
        label: "Subtree"
        text: "naive `same()` at every node is O(n\\cdot m) and is fine. The O(n+m) substring trick needs comma delimiters (so `2` does not match inside `12`) and null markers (so a partial match cannot succeed)."
      - kind: "cloze"
        label: "____ — the O(n) route to LC 652 (duplicate subtrees): count each subtree's serialisation in a dictionary."
        text: "Serialisation as a hash key"
  - id: "tree-bfs-and-level-order"
    title: "Tree BFS and Level Order"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/tree-bfs-and-level-order/"
    patterns: ["tree-bfs-and-level-order", "tree-bfs", "level-order", "binary-trees", "stacks-and-queues", "amazon", "meta", "google", "microsoft", "apple"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "the words level, row, depth, nearest, width, or \"connect each node to its right neighbour\"."
      - kind: "aspect"
        label: "Invariant"
        text: "at the top of each outer iteration, the queue holds exactly one complete level."
      - kind: "aspect"
        label: "Template"
        text: "`deque`, `while queue:`, snapshot `n = len(queue)`, inner `for _ in range(n)` that pops one node and pushes its children."
      - kind: "aspect"
        label: "Complexity"
        text: "O(n) time, O(w) space (widest level). Mirror image of DFS's O(h)."
      - kind: "aspect"
        label: "Choose DFS instead when"
        text: "the answer is a root-to-leaf path, a subtree property, or anything returned up from children. Minimum depth is BFS; maximum depth is DFS."
  - id: "tree-construction-from-traversals"
    title: "Tree Construction from Traversals"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/tree-construction-from-traversals/"
    patterns: ["tree-construction-from-traversals", "binary-trees-and-bst", "hash-tables", "amazon", "google", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"construct the binary tree from these two traversals\", or \"build the tree defined by this rule\"."
      - kind: "aspect"
        label: "What each array gives"
        text: "pre-order (or reversed post-order): the root of each window. In-order: where that root splits the window."
      - kind: "aspect"
        label: "Template"
        text: "`index = {v: i for i, v in enumerate(inorder)}`; one `nonlocal` pointer into the pre/post array; `helper(left, right)` over in-order indices."
      - kind: "aspect"
        label: "Base case"
        text: "`left > right`. A single-element window is a leaf, not empty."
      - kind: "aspect"
        label: "Recursion order is forced"
        text: "pre-order: left then right; post-order consumed from the end: right then left. Getting it wrong mirrors the tree silently."
      - kind: "aspect"
        label: "Cost"
        text: "O(n) with the map, O(n^2) with `index()` per node, O(n^2) time and space with slicing."
      - kind: "aspect"
        label: "Assumes distinct values"
        text: "with duplicates the reconstruction is not unique, so the problem is ill-posed rather than the code being wrong."
      - kind: "cloze"
        label: "____ — (unless the tree is full) — there is no way to tell a single left child from a single right one."
        text: "Pre-order + post-order alone is not enough"
  - id: "tree-dfs-paths-and-sums"
    title: "Tree DFS Paths and Sums"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/tree-dfs-paths-and-sums/"
    patterns: ["tree-dfs-paths-and-sums", "binary-trees-and-bst", "python-recursion-and-iterative-conversion", "meta", "amazon", "google", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "a question about paths, sums, depths or bends in a binary tree. Ask first: does a child need something from above, or does a parent need something from below?"
      - kind: "aspect"
        label: "Channel 1, downward"
        text: "pass what the child needs as a parameter, usually the remaining target. No undo needed, because each call owns its copy."
      - kind: "aspect"
        label: "Channel 2, upward"
        text: "recurse both sides, then combine. `max_depth`, `validate`, `balanced` are all this with a different combine step."
      - kind: "aspect"
        label: "Leaf test"
        text: "`not node.left and not node.right`. A one-child node is not a leaf; that is the family's defining bug."
      - kind: "aspect"
        label: "Collecting paths"
        text: "choose / recurse / un-choose, with one `pop` per `append`, and `out.append(list(path))` — the copy is mandatory."
      - kind: "aspect"
        label: "Split-brain"
        text: "(any path, not through the root) — record `left + right` (bends here, finished), return `1 + max(left, right)` (extendable). The answer is the side channel, never the return value."
      - kind: "aspect"
        label: "Cost"
        text: "O(n) time, O(h) stack; O(n \\cdot h) when the output is every path. Mention Python's ~1000-frame limit on degenerate trees."
  - id: "0-1-bfs-and-deque-shortest-paths"
    title: "0-1 BFS and Deque Shortest Paths"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/0-1-bfs-and-deque-shortest-paths/"
    patterns: ["0-1-bfs-and-deque-shortest-paths", "breadth-first-search", "shortest-paths-dijkstra-bellman-ford-and-floyd-warshall", "multi-source-bfs", "google", "amazon", "bytedance", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "shortest path where every move costs 0 or 1; usually a grid asking for the minimum number of things to change."
      - kind: "aspect"
        label: "Structure"
        text: "`deque`. 0-edge → `appendleft` (same layer), 1-edge → `append` (next layer)."
      - kind: "aspect"
        label: "Guard"
        text: "push only when `dist[v] + wt < dist[u]`, strictly. That replaces Dijkstra's stale-entry check and makes duplicate entries harmless."
      - kind: "aspect"
        label: "No `visited` set"
        text: "a 0-edge can improve an already-popped node."
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E) time, O(V) space; Dijkstra's answer without the \\log V."
      - kind: "aspect"
        label: "Modelling"
        text: "the weight belongs to the move, not the cell. Free = the move the input already permits; 1 = anything you had to change."
      - kind: "aspect"
        label: "Boundary"
        text: "0 and one fixed k: fine. Three distinct weights: Dijkstra, or a bucket queue for small integer weights."
  - id: "bfs-and-dijkstra-with-extra-state"
    title: "BFS and Dijkstra with Extra State"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/bfs-and-dijkstra-with-extra-state/"
    patterns: ["bfs-and-dijkstra-with-extra-state", "state-space-search", "breadth-first-search", "shortest-paths-dijkstra-bellman-ford-and-floyd-warshall", "google", "amazon", "uber", "bytedance", "meta"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "a budget (`k` stops, `k` removals), a collection (keys, targets), or a mode (fuel, parity). Test: can the same node in different circumstances give different outcomes?"
      - kind: "aspect"
        label: "The fix"
        text: "state is a tuple, not a node: `(node, budget)`, `(cell, mask)`. Key the visited set on the whole tuple."
      - kind: "aspect"
        label: "BFS or Dijkstra"
        text: "unchanged rule: equal move costs → BFS, differing → Dijkstra. The extra dimension does not affect that choice."
      - kind: "aspect"
        label: "State space multiplies"
        text: "nodes × budget values. That is the runtime and the reason caps are small."
      - kind: "cloze"
        label: "____ — keys ≤ 6, nodes ≤ 12 means a bitmask dimension."
        text: "Small caps are a hint"
      - kind: "aspect"
        label: "LC 787"
        text: "plain Dijkstra is wrong. Bellman-Ford with `k + 1` rounds and a per-round snapshot is the clean answer."
  - id: "breadth-first-search"
    title: "Breadth First Search"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/breadth-first-search/"
    patterns: ["breadth-first-search", "graph-representations", "stacks-and-queues", "amazon", "google", "meta", "microsoft", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "fewest steps / shortest path / minimum moves, with every move costing the same; or per-level output."
      - kind: "aspect"
        label: "Structure"
        text: "`deque`, `popleft()`. FIFO is not a detail: it is the shortest-path guarantee."
      - kind: "aspect"
        label: "Mark visited on enqueue"
        text: ", never on dequeue."
      - kind: "aspect"
        label: "Distances for free"
        text: "replace `visited` with `dist = {start: 0}` and set `dist[nxt] = dist[node] + 1` at enqueue time."
      - kind: "aspect"
        label: "Levels"
        text: "`for _ in range(len(queue))`, with the length snapshotted before the loop."
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E) time; O(V) visited plus a queue holding at most one layer."
      - kind: "aspect"
        label: "Path"
        text: "store `parent[nxt] = node` on enqueue, then walk back from the target."
      - kind: "aspect"
        label: "Boundaries"
        text: "0/1 weights → deque; arbitrary weights → Dijkstra; negative → Bellman-Ford; reachability only → DFS is cheaper in space."
  - id: "cycle-detection-and-bipartite-checking"
    title: "Cycle Detection and Bipartite Checking"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/cycle-detection-and-bipartite-checking/"
    patterns: ["cycle-detection-and-bipartite-checking", "depth-first-search", "topological-sort", "google", "amazon", "meta"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"is it possible\" under one-way constraints (cycle), \"is it a tree\" (connected + acyclic), or \"split into two groups\" (bipartite)."
      - kind: "aspect"
        label: "Undirected cycle"
        text: "DFS carrying the parent; skip the edge you arrived on. Or union-find, where a failed `union` names the closing edge."
      - kind: "aspect"
        label: "Directed cycle"
        text: "three states. GREY = on the current path, and an edge into GREY is the cycle. BLACK on exit is mandatory, not tidiness."
      - kind: "cloze"
        label: "____ — two parents is not a loop."
        text: "Plain visited fails on directed graphs"
      - kind: "aspect"
        label: "Bipartite"
        text: "2-colour, flipping across every edge; a same-colour edge fails. Loop over all nodes: the graph may be disconnected."
      - kind: "cloze"
        label: "____ — an odd number of flips cannot return to the starting colour."
        text: "Bipartite ⇔ no odd cycle"
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E) time, O(V) space for all three."
      - kind: "aspect"
        label: "Walls"
        text: "k-colouring for k \\ge 3 is NP-complete; the shortest cycle needs BFS from every node, O(V \\cdot E)."
  - id: "depth-first-search"
    title: "Depth First Search"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/depth-first-search/"
    patterns: ["depth-first-search", "graph-representations", "python-recursion-and-iterative-conversion", "amazon", "google", "meta", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "reachability, components, all-paths, cycles, or anything defined on a node's descendants. Not shortest paths."
      - kind: "aspect"
        label: "Recursive shape"
        text: "mark visited, record, then recurse into each unvisited neighbour. Work placed before the calls is pre-order; after them is post-order, which is what subtree summaries and topological order need."
      - kind: "aspect"
        label: "Iterative shape"
        text: "a stack, `pop()`. It is the BFS template with `popleft()` swapped for `pop()`; sibling order reverses, and mark-on-pop reproduces the recursive order."
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E) time; O(V) visited plus O(h) stack. BFS's mirror is the widest layer."
      - kind: "aspect"
        label: "Cycles"
        text: "directed: three states, back edge into an in-progress node. Undirected: two states plus the parent."
      - kind: "cloze"
        label: "____ — append, recurse, `pop()`; copy the path when recording it."
        text: "Backtracking is DFS plus undo"
      - kind: "aspect"
        label: "Python"
        text: "a 10^5-node chain exceeds the ~1000-frame recursion limit; use the explicit stack and say so unprompted."
  - id: "eulerian-paths-and-reconstruct-itinerary"
    title: "Eulerian Paths and Reconstruct Itinerary"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/eulerian-paths-and-reconstruct-itinerary/"
    patterns: ["eulerian-paths", "depth-first-search", "graph-representations", "google", "amazon", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "use every edge exactly once; nodes may repeat. Answer is an ordering of edges, often lexicographically smallest."
      - kind: "aspect"
        label: "Feasibility first"
        text: "directed: connected, and all `in == out`, or one node `out = in + 1` and one `in = out + 1`. Undirected: connected, and 0 or 2 odd-degree nodes."
      - kind: "aspect"
        label: "Hierholzer"
        text: "consume edges from a node until exhausted, then append the node; reverse at the end."
      - kind: "aspect"
        label: "No visited set"
        text: "popping the edge is what marks it used."
      - kind: "aspect"
        label: "Complexity"
        text: "O(V + E), or O(E \\log E) with a heap for lexicographic order."
      - kind: "aspect"
        label: "Not Hamiltonian"
        text: "every node once is NP-hard. Check which you have."
  - id: "graph-traversal-and-connected-components"
    title: "Graph Traversal and Connected Components"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/graph-traversal-and-connected-components/"
    patterns: ["graph-traversal-and-connected-components", "breadth-first-search", "depth-first-search", "amazon", "google", "meta"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "count the groups, or \"is everything reachable\"; constraints that mention the graph may be disconnected."
      - kind: "aspect"
        label: "The sweep"
        text: "`for start in range(n)`: skip if visited, otherwise start a traversal and increment. The count of starts is the answer."
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E): skips are O(1) and each node/edge is touched once overall. O(V^2) if the input is an adjacency matrix, which is inherent to the representation."
      - kind: "aspect"
        label: "BFS or DFS, freely"
        text: "the sweep is identical. Prefer iterative on deep graphs; CPython dies at ~1000 frames."
      - kind: "cloze"
        label: "____ — , not by the nodes in the edge list — an isolated node is a component."
        text: "Size the loop by `n`"
      - kind: "aspect"
        label: "Accumulate inside"
        text: "for sizes, largest component, or a component id per node."
      - kind: "aspect"
        label: "Tree"
        text: "= one component and `len(edges) == n - 1`."
      - kind: "aspect"
        label: "Boundaries"
        text: "directed graphs need SCCs, not this sweep; incremental edges need union-find; distances need BFS."
  - id: "grid-traversal-islands-and-flood-fill"
    title: "Grid Traversal Islands and Flood Fill"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/grid-traversal-islands-and-flood-fill/"
    patterns: ["grid-traversal-islands-and-flood-fill", "breadth-first-search", "depth-first-search", "amazon", "google", "meta", "microsoft", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "a 2-D grid where adjacent same-valued cells form regions: count them, measure them, or recolour one."
      - kind: "aspect"
        label: "Idea"
        text: "the grid is the graph; the four offsets `(1,0) (-1,0) (0,1) (0,-1)` are the adjacency function. Nothing gets built."
      - kind: "aspect"
        label: "Template"
        text: "base case checks bounds and validity; mark before recursing; the outer double loop counts sink starts, which is the component count."
      - kind: "aspect"
        label: "Visited"
        text: "sink the grid (mutates the caller's input) or a `visited` set (O(rc) space). Say which and why."
      - kind: "aspect"
        label: "Cost"
        text: "O(rc) time; the recursion is O(rc) deep worst case, so use an explicit stack or BFS on large grids. \"O(1) space\" is a wrong answer."
      - kind: "aspect"
        label: "Boundary inversion"
        text: "for \"regions not touching the edge\" (LC 130, 1020, 417), flood inward from the border and invert."
      - kind: "aspect"
        label: "Read the cell type"
        text: "`\"1\"` in LC 200, `1` in LC 695; diagonals are not adjacent under 4-directional rules."
  - id: "multi-source-bfs"
    title: "Multi-source BFS"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/multi-source-bfs/"
    patterns: ["multi-source-bfs", "breadth-first-search", "grid-traversal-islands-and-flood-fill", "amazon", "microsoft", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"distance to the nearest X\" or \"time for X to spread everywhere\", with many starting cells. If you are about to write \"BFS from each source\", stop."
      - kind: "aspect"
        label: "Do"
        text: "push all sources into the queue with distance 0, then run one ordinary BFS."
      - kind: "aspect"
        label: "Why it is correct"
        text: "identical to BFS from a virtual super-source joined to every source by a 0-cost edge."
      - kind: "aspect"
        label: "Mark on enqueue"
        text: ", never on dequeue. `dist[r][c] = -1` doubles as the visited set."
      - kind: "aspect"
        label: "Elapsed time"
        text: "level loop with a `for _ in range(len(queue))` snapshot."
      - kind: "aspect"
        label: "Unreachable"
        text: "keep a counter of remaining work; `fresh > 0` at the end means `-1`. Loop `while queue and fresh` to avoid counting a dead final minute."
      - kind: "aspect"
        label: "Cost"
        text: "O(mn) time and space, independent of the source count. Weighted variants: deque for 0/1 costs, heap for arbitrary."
  - id: "shortest-paths-dijkstra-bellman-ford-and-floyd-warshall"
    title: "Shortest Paths: Dijkstra, Bellman-Ford, and Floyd-Warshall"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/shortest-paths-dijkstra-bellman-ford-and-floyd-warshall/"
    patterns: ["shortest-paths-dijkstra-bellman-ford-and-floyd-warshall", "breadth-first-search", "heaps-and-priority-queues", "google", "uber", "amazon", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "minimum cost/time/distance where moves cost different amounts. Equal costs → BFS; 0/1 → deque."
      - kind: "aspect"
        label: "Dijkstra"
        text: "heap of `(dist, node)`; pop, skip if `d > dist[node]` (stale), relax neighbours, push improvements. O(E \\log V). Non-negative weights only."
      - kind: "cloze"
        label: "____ — that is the whole correctness argument, and exactly what a negative edge invalidates."
        text: "A popped non-stale node is final"
      - kind: "aspect"
        label: "Bellman-Ford"
        text: "V-1 rounds over all edges, O(V\\cdot E). Handles negatives; one extra round detects a negative cycle; `k+1` rounds answers \"at most `k` edges\"."
      - kind: "aspect"
        label: "Floyd-Warshall"
        text: "`k` outermost, then `i`, `j`; O(V^3), good to about V \\le 400; a negative value on the diagonal means a negative cycle."
      - kind: "aspect"
        label: "DAG"
        text: "relax in topological order: O(V+E) and negatives are fine."
      - kind: "cloze"
        label: "____ — `max(d, w)` for bottleneck, `min` for widest, multiply for probabilities."
        text: "Same heap, different relaxation"
      - kind: "aspect"
        label: "Path"
        text: "store `parent[v]` when you relax, then walk back."
  - id: "topological-sort"
    title: "Topological Sort"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/topological-sort/"
    patterns: ["topological-sort", "graph-representations", "breadth-first-search", "google", "amazon", "meta", "bytedance"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "dependencies, prerequisites, \"must come before\", or \"is any order possible\". Directed graph, no distances."
      - kind: "aspect"
        label: "Exists iff DAG"
        text: "so ordering and cycle detection are one algorithm."
      - kind: "aspect"
        label: "Kahn's"
        text: "count in-degrees, seed the queue with every zero, pop and decrement neighbours, enqueue only when a neighbour's in-degree hits 0."
      - kind: "aspect"
        label: "Cycle test"
        text: "`len(order) != n`. The missing nodes are on or behind the cycle."
      - kind: "aspect"
        label: "DFS version"
        text: "append on exit, then reverse; `GRAY` (in-progress) neighbour means a cycle."
      - kind: "aspect"
        label: "Cost"
        text: "O(V + E) for both. Kahn's avoids recursion limits; DFS composes with other DFS work."
      - kind: "aspect"
        label: "Not unique"
        text: "queue size above 1 means several valid orders; a heap gives the lexicographically smallest."
      - kind: "cloze"
        label: "____ — relax in topological order for critical paths and minimum schedules."
        text: "Unlocks longest-path on a DAG"
  - id: "union-find-problem-patterns"
    title: "Union-Find Problem Patterns"
    phase: "Phase-10-Patterns-Graphs"
    url: "/dsa-with-python/phase-10-patterns-graphs/union-find-problem-patterns/"
    patterns: ["union-find-problem-patterns", "union-find-disjoint-set-union", "google", "amazon", "uber"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "connectivity questions where edges arrive over time: \"are these two connected\", \"how many groups\", \"which edge creates a cycle\", \"merge these accounts\"."
      - kind: "aspect"
        label: "Structure"
        text: "`parent` array plus `rank`; `components` counter maintained by `union`."
      - kind: "aspect"
        label: "`find`"
        text: "walk to the root, halving as you go (`parent[x] = parent[parent[x]]`)."
      - kind: "aspect"
        label: "`union`"
        text: "find both roots; equal roots → return `False` (this edge is a cycle); else attach the lower-rank root under the higher, incrementing rank only on a tie, decrement `components`, return `True`."
      - kind: "aspect"
        label: "Cost"
        text: "effectively O(1) per operation; formally O(\\alpha(n)) amortised. Both optimisations are required for that — either one alone leaves O(\\log n)."
      - kind: "aspect"
        label: "Cannot do"
        text: "shortest paths, directed relationships, edge deletion. Those are DFS/BFS or a rebuild."
      - kind: "aspect"
        label: "Watch"
        text: "1-indexed inputs need `n + 1` slots; feasibility checks (LC 1319) come before the merging; equality constraints before inequalities (LC 990)."
  - id: "backtracking"
    title: "Backtracking"
    phase: "Phase-11-Recursion-and-Backtracking"
    url: "/dsa-with-python/phase-11-recursion-and-backtracking/backtracking/"
    patterns: ["backtracking", "python-recursion-and-iterative-conversion"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "enumerate all (or find any) solutions to a constraint problem; the answer is a sequence of coupled choices; constraints are tiny (`n ≤ 8`–`20`)."
      - kind: "aspect"
        label: "The skeleton"
        text: "choose → explore → un-choose, with every mutation undone in reverse."
      - kind: "aspect"
        label: "Snapshot on record"
        text: "`results.append(path[:])`, never `path`."
      - kind: "aspect"
        label: "Prune before recursing"
        text: ", not at the leaf. That is where all the savings are: 4-Queens visits 17 nodes instead of 256; 8-Queens 2,057 instead of 16.7 million."
      - kind: "aspect"
        label: "Make the prune O(1)"
        text: "N-Queens uses `cols`, `r − c`, `r + c` sets; Sudoku uses row/col/box sets; Word Search mutates the grid itself."
      - kind: "cloze"
        label: "____ — Mixing them up is the standard structural error."
        text: "`start` index for combinations, `used[]` for permutations."
      - kind: "aspect"
        label: "One solution needed?"
        text: "Return `True` and propagate — do not enumerate the rest."
      - kind: "aspect"
        label: "Cost"
        text: "the size of the decision tree: O(n!) permutations, O(2^n) subsets. Pruning changes the constant, never the class."
      - kind: "cloze"
        label: "____ — (most-constrained variable) when the tree is still too big."
        text: "Order choices to fail fast"
  - id: "divide-and-conquer"
    title: "Divide and Conquer"
    phase: "Phase-11-Recursion-and-Backtracking"
    url: "/dsa-with-python/phase-11-recursion-and-backtracking/divide-and-conquer/"
    patterns: ["divide-and-conquer", "python-recursion-and-iterative-conversion", "amazon", "bytedance", "google", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "the problem splits into independent subproblems of the same shape, and the results combine cheaply: sorting, counting pairs across halves, searching a halved space, expression parenthesisation."
      - kind: "aspect"
        label: "Skeleton"
        text: "base case → split → recurse on each part → combine. The combine step is where the real work (and the complexity) lives."
      - kind: "aspect"
        label: "Cost"
        text: "recursion tree: work per level × number of levels. Master Theorem for T(n) = aT(n/b) + O(n^d): compare d with \\log_b a, larger wins, ties add \\log n."
      - kind: "aspect"
        label: "Merge sort"
        text: "O(n \\log n) time, O(n) space, O(\\log n) stack; the tie case of the theorem."
      - kind: "aspect"
        label: "Counting during the merge"
        text: "inversions and reverse pairs ride along free, because both halves are sorted at that moment. Keep the counting pointer outside the loop."
      - kind: "cloze"
        label: "____ — quick sort shares the recurrence and degrades to O(n^2) when pivots are bad."
        text: "Balance is the whole guarantee"
      - kind: "aspect"
        label: "Boundary"
        text: "overlapping subproblems mean this is the wrong frame; cache them and it becomes DP."
  - id: "permutations-and-arrangements"
    title: "Permutations and Arrangements"
    phase: "Phase-11-Recursion-and-Backtracking"
    url: "/dsa-with-python/phase-11-recursion-and-backtracking/permutations-and-arrangements/"
    patterns: ["permutations-and-arrangements", "python-recursion-and-iterative-conversion"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"all orderings / arrangements / permutations\", order matters, every element used. Tiny constraints (`n <= 8`)."
      - kind: "aspect"
        label: "Template"
        text: "a `used[]` array, not a `start` index: every index is available at every depth. Choose → recurse → un-choose, and `out.append(list(path))` — the copy is mandatory."
      - kind: "aspect"
        label: "Duplicates (LC 47)"
        text: "sort, then skip `nums[i] == nums[i-1] and not used[i-1]`. The rule is \"fix one consumption order within each run of equal values\"; the mirrored spelling `used[i-1]` is equally valid, the sort is not optional."
      - kind: "aspect"
        label: "Swap-based variant"
        text: "one shared array, swap and swap back; O(n) extra space instead of O(n \\cdot n!)."
      - kind: "aspect"
        label: "Cost"
        text: "O(n \\cdot n!) time, and that is optimal: the output alone is n! entries."
      - kind: "aspect"
        label: "Next permutation (LC 31)"
        text: "find the rightmost `a[i] < a[i+1]` (the pivot), swap with the rightmost value greater than it, reverse the suffix. O(n) time, O(1) space, no recursion."
      - kind: "aspect"
        label: "k-th permutation (LC 60)"
        text: "do not enumerate; use factorial-base arithmetic to pick each digit directly."
  - id: "subsets-and-combinations"
    title: "Subsets and Combinations"
    phase: "Phase-11-Recursion-and-Backtracking"
    url: "/dsa-with-python/phase-11-recursion-and-backtracking/subsets-and-combinations/"
    patterns: ["subsets-and-combinations", "python-recursion-and-iterative-conversion"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "\"all subsets / power set / combinations / choose `k`\", where order does not matter and elements may be skipped. Tiny `n`."
      - kind: "aspect"
        label: "Template"
        text: "`backtrack(start)`: record `path[:]` at every node, then loop `i` from `start`, choose → recurse with `i + 1` → un-choose."
      - kind: "cloze"
        label: "____ — it forbids revisiting earlier elements, which is what makes `{1,2}` and `{2,1}` one answer. Permutations use `used[]` instead."
        text: "`start` is the whole design"
      - kind: "aspect"
        label: "Duplicates"
        text: "sort, then skip `i > start and nums[i] == nums[i-1]`. `i > start`, not `i > 0`."
      - kind: "aspect"
        label: "Combinations"
        text: "record only when `len(path) == k`; prune when too few elements remain."
      - kind: "aspect"
        label: "Reuse allowed (LC 39)"
        text: "recurse with `i`, not `i + 1`."
      - kind: "aspect"
        label: "Copy on record"
        text: "`path[:]`, always."
      - kind: "aspect"
        label: "Cost"
        text: "O(n \\cdot 2^n) for subsets, O(k \\cdot C(n,k)) for combinations. Optimal: the output is the bound."
      - kind: "aspect"
        label: "Alternatives"
        text: "bitmask (`for m in range(1 << n)`) or cascading doubling, both iterative."
      - kind: "aspect"
        label: "Counting, not listing?"
        text: "That is DP, not this."
  - id: "bitmask-and-tree-dp"
    title: "Bitmask and Tree DP"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/bitmask-and-tree-dp/"
    patterns: ["bitmask-and-tree-dp", "two-dimensional-dp-and-knapsack", "bit-manipulation-tricks", "google", "bytedance"]
