        text: "Combinations → items outer. Permutations → capacity outer."
      - kind: "aspect"
        label: "Booleans"
        text: "`dp[0] = True`, `dp[c] |= dp[c-n]`. Counting — `dp[0] = 1`, `dp[a] += dp[a-c]`. Minimising — `dp[0] = 0`, rest `inf`."
      - kind: "aspect"
        label: "Sign transform (LC 494)"
        text: "target subset is `(total + target) // 2`; reject odd or negative."
      - kind: "aspect"
        label: "Cost"
        text: "O(nC) time, O(C) space, pseudo-polynomial: fine for C \\le 10^5, hopeless for 10^{12}."
      - kind: "aspect"
        label: "Recovering the chosen items"
        text: "needs the 2D table back."
  - id: "lis-variants-and-patience-sorting"
