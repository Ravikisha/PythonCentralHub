  - id: "design-with-stacks-and-queues"
    title: "Design with Stacks and Queues"
    phase: "Phase-14-Design-Problems"
    url: "/dsa-with-python/phase-14-design-problems/design-with-stacks-and-queues/"
    patterns: ["design-with-stacks-and-queues", "hash-tables", "linked-lists"]
