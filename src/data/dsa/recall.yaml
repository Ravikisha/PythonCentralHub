  - id: "binary-lifting-and-sparse-lca"
    title: "Binary Lifting and Sparse LCA"
    phase: "Phase-09-Patterns-Trees"
    url: "/dsa-with-python/phase-09-patterns-trees/binary-lifting-and-sparse-lca/"
    patterns: ["binary-lifting-and-sparse-lca", "lowest-common-ancestor", "tree-dfs-paths-and-sums", "bit-manipulation-tricks", "google", "bytedance", "amazon", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "one static tree, many ancestor or LCA queries; or a k-th ancestor request; or \"after k steps\" on a functional graph."
      - kind: "aspect"
        label: "Table"
        text: "`up[0][v] = parent(v)`, then `up[k][v] = up[k-1][up[k-1][v]]`. Size `n.bit_length()` powers. `-1` means past the root."
      - kind: "aspect"
        label: "K-th ancestor"
        text: "walk the set bits of k, jumping by `up[b]`, returning −1 on overshoot."
      - kind: "aspect"
        label: "LCA"
        text: "level the deeper node by the set bits of the depth difference; if they coincide, done; else jump both from the highest power down while the ancestors differ; answer is `up[0][a]`."
      - kind: "aspect"
        label: "Distance"
        text: "depth[a] + depth[b] - 2\\,depth[lca]."
      - kind: "aspect"
        label: "Cost"
        text: "O(n\\log n) preprocess and space, O(\\log n) per query. Worth it from roughly \\log n queries up."
      - kind: "aspect"
        label: "Fill `up[0]` with BFS"
        text: ", never recursion — a path of 10^5 nodes is a legal tree."
