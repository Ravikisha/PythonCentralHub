      - kind: "aspect"
        label: "State"
        text: "a prefix, or a pair of prefixes: `dp[i][j]` answers the question for `a[:i]` and `b[:j]`."
      - kind: "aspect"
        label: "Recurrence shape"
        text: "match → diagonal (± 1); mismatch → best of the neighbours you are allowed to move to."
      - kind: "aspect"
        label: "Base cases"
        text: "LCS: zeros. Edit distance: `dp[i][0] = i`, `dp[0][j] = j`. Getting this wrong is the usual off-by-a-constant."
      - kind: "aspect"
        label: "Complexity"
        text: "O(m \\cdot n) time and space; space collapses to O(\\min(m, n)) because each row reads only the row above. LIS drops from O(n^2) to O(n \\log n) via patience sorting."
      - kind: "aspect"
        label: "Answer vs. table"
        text: "the table holds a length. The actual subsequence or edit script comes from walking backward through the choices."
  - id: "digit-dp"
    title: "Digit DP"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/digit-dp/"
    patterns: ["digit-dp", "from-recursion-to-dp", "two-dimensional-dp-and-knapsack", "bitmask-and-tree-dp", "google", "bytedance", "amazon", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "count the numbers in a huge range with a digit property; the bound arrives as a string or as 10^{18}."
      - kind: "aspect"
        label: "State"
        text: "`(pos, tight, started, extra)`. `tight` = still equal to the bound's prefix, `started` = a non-zero digit has been placed, `extra` = the problem (mask, remainder, previous digit, tally)."
      - kind: "aspect"
        label: "Transition"
        text: "`hi = int(bound[pos]) if tight else 9`; loop `d` in `0..hi`; the next state is tight only if `tight and d == hi`."
      - kind: "aspect"
        label: "Base case"
        text: "`pos == n` returns 1 (or `extra` for a tally), gated on `started`."
      - kind: "aspect"
        label: "Cost"
        text: "O(n \\cdot S \\cdot 10) with n \\le 18: always fast unless the extra state is huge."
      - kind: "aspect"
        label: "Range"
        text: "`f(R) − f(L−1)`. Inclusive because the tight path counts N itself."
      - kind: "aspect"
        label: "Two bugs"
        text: "dropping the tight contribution (off by one, only when N qualifies) and memoizing across `tight` (silent undercount)."
  - id: "dp-on-grids-and-intervals"
    title: "DP on Grids and Intervals"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/dp-on-grids-and-intervals/"
