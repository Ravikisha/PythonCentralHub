      - kind: "aspect"
        label: "Layout"
        text: "flat array of `2n`: leaves at `n..2n-1`, node `i` = `merge(2i, 2i+1)`. Build bottom-up in O(n)."
      - kind: "aspect"
        label: "Query `[l, r)`"
