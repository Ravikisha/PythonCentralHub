      - kind: "aspect"
        label: "2D honest form"
        text: "`dp[i][c] = max(dp[i-1][c], dp[i-1][c-w] + v)`. Both sources are in the previous row; that is what the 1D collapse must preserve."
      - kind: "cloze"
        label: "____ — Unbounded → capacity ASCENDING. Derive it from \"has this index been written this round?\""
        text: "0/1 → capacity DESCENDING."
      - kind: "cloze"
