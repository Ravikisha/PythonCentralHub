        text: "The modelling is the hard part"
      - kind: "cloze"
        label: "____ — Recognise the matching shape, say so, write Kuhn's."
        text: "You will not write Dinic's in an interview."
  - id: "minimum-spanning-trees-kruskal-and-prim"
