  - id: "from-recursion-to-dp"
    title: "From Recursion to DP"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/from-recursion-to-dp/"
    patterns: ["from-recursion-to-dp", "python-recursion-and-iterative-conversion", "google", "amazon", "meta", "microsoft"]
    prompts:
      - kind: "aspect"
        label: "Cue"
        text: "a correct recursion exists and is too slow because the same argument recurs. Counting, max/min, or reachability, with a greedy that provably fails."
      - kind: "aspect"
        label: "Two required properties"
        text: "optimal substructure and overlapping subproblems. Without the second, a cache buys nothing (binary search, merge sort)."
      - kind: "cloze"
        label: "____ — (1) write the recursion, (2) its parameters are the state, (3) cache it. Never design the table first."
        text: "The method, in three steps"
      - kind: "aspect"
        label: "Complexity"
        text: "states × work per state. n \\times O(1) for Fibonacci, nW for knapsack, n^2 \\times O(n) for interval DP."
      - kind: "aspect"
        label: "Top-down"
        text: "mechanical, skips unreachable states, dies at CPython's ~1000 frames. Bottom-up — you choose the fill order, no depth limit, and space collapses to rolling rows."
      - kind: "cloze"
        label: "____ — omitting one gives a silently wrong answer."
        text: "Every parameter that affects the answer must be in the cache key"
      - kind: "cloze"
        label: "____ — `dp[0]` on an empty prefix is 1 for a count, 0 for a sum, `inf` for a minimisation."
        text: "Base cases follow from the state's meaning"
      - kind: "aspect"
        label: "Naive Fibonacci is O(\\phi^n)"
        text: ", exactly 2\\,fib(n+1) - 1 calls; O(2^n) is the loose bound."
  - id: "knapsack-variants-and-subset-sum"
    title: "Knapsack Variants and Subset Sum"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/knapsack-variants-and-subset-sum/"
    patterns: ["knapsack-variants-and-subset-sum", "two-dimensional-dp-and-knapsack", "google", "amazon", "bytedance"]
