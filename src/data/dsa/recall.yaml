        label: "The shape"
        text: "- a design problem is a data structure plus one extra piece of state maintained by the same push/pop rhythm. Find the extra state and the problem is solved."
      - kind: "aspect"
        label: "Min Stack"
        text: "- store `(value, min_at_this_depth)`. Popping restores the earlier minimum for free. O(1) worst case, O(n) space. Second-stack variant: push on `<=`, never `<`."
      - kind: "aspect"
        label: "Two-stack queue"
        text: "- `inbox` takes pushes, `outbox` serves pops, refill only when `outbox` is empty. Each element moves exactly once, so O(1) amortised, O(n) worst case on a single `pop`. Say \"amortised\" out loud."
      - kind: "cloze"
        label: "____ — - an item in `inbox` with an empty `outbox` is still an item."
        text: "`empty()` must check both stacks"
      - kind: "aspect"
        label: "Circular queue"
        text: "- keep `head` and `count`, derive the tail. A `head`/`tail` pair cannot distinguish full from empty."
      - kind: "cloze"
        label: "____ — `count` defines what is live; the stale bytes are harmless."
        text: "Never clear slots on dequeue."
      - kind: "aspect"
        label: "Stack from one queue"
        text: "is O(n) on one side, with no amortisation to rescue it -- the rotation repeats every call."
  - id: "simulation-and-stateful-iteration"
    title: "Simulation and Stateful Iteration"
