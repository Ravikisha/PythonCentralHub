        text: "Greedy is correct by the cut property"
      - kind: "aspect"
        label: "Kruskal"
        text: "= sort all edges once, then keep an edge iff `union` succeeds. Equal `find` roots means a cycle. O(E \\log E), dominated by the sort. Grows a forest and merges at the end."
      - kind: "aspect"
        label: "Prim"
        text: "= grow one tree from any seed, heap keyed on the raw edge weight. O(E \\log V)."
      - kind: "cloze"
