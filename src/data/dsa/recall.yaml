    title: "Data Structure Templates"
    phase: "Phase-18-Templates-and-Cheatsheets"
    url: "/dsa-with-python/phase-18-templates-and-cheatsheets/data-structure-templates/"
    patterns: ["union-find-problem-patterns", "segment-trees-and-lazy-propagation", "fenwick-tree-binary-indexed-tree", "trie-patterns", "arrays-and-dynamic-arrays", "binary-trees-and-bst"]
    prompts:
      - kind: "aspect"
        label: "Union-Find"
        text: "`parent` + `rank`, path-halving `find`, `union` returns `False` when already joined. Keep a `components` counter and decrement only on a successful union. O(\\alpha(n))."
      - kind: "aspect"
        label: "Segment tree"
        text: "flat array, leaves at `n..2n-1`, node `i` = `merge(2i, 2i+1)`. Any associative merge. `2n` iterative, `4n` recursive."
      - kind: "aspect"
        label: "Fenwick tree"
        text: "`tree[i]` = sum of the `lowbit(i)` elements ending at `i`. Update `i += i & -i`, query `i -= i & -i`. 1-indexed always. Invertible operations only."
      - kind: "aspect"
        label: "Trie"
        text: "a `dict` per node plus an end-of-word flag; without the flag `search` and `startsWith` collapse into one thing."
      - kind: "aspect"
        label: "Choosing"
        text: "static + min/max → sparse table; mutable + invertible → Fenwick; mutable + min/max or range updates → segment tree; connectivity over arriving edges → union-find."
      - kind: "cloze"
        label: "____ — Union-find is the only one short enough that you should."
        text: "All four are worth typing once from memory."
  - id: "graph-algorithm-templates"
    title: "Graph Algorithm Templates"
    phase: "Phase-18-Templates-and-Cheatsheets"
    url: "/dsa-with-python/phase-18-templates-and-cheatsheets/graph-algorithm-templates/"
    patterns: ["breadth-first-search", "depth-first-search", "shortest-paths-dijkstra-bellman-ford-and-floyd-warshall", "minimum-spanning-trees-kruskal-and-prim", "topological-sort", "union-find-problem-patterns", "graph-representations"]
    prompts:
      - kind: "aspect"
        label: "BFS"
        text: "`deque`, `popleft`, mark visited on enqueue. Shortest path when every edge costs the same. O(V+E)."
      - kind: "aspect"
        label: "DFS"
        text: "stack or recursion; the same loop with `pop()` instead of `popleft()`. Reachability, components, cycles. O(V+E), O(h) stack."
      - kind: "aspect"
        label: "Dijkstra"
        text: "heap of `(dist, node)`; skip stale pops with `if d > dist[node]: continue`. Non-negative weights only. O(E \\log V)."
      - kind: "aspect"
        label: "Bellman-Ford"
        text: "V-1 rounds over all edges; one extra round detects a negative cycle. O(VE)."
      - kind: "aspect"
        label: "Prim"
        text: "grow one tree with a heap, skipping nodes already in it. Kruskal — sort edges, union with DSU, take an edge when `union` returns `True`. Both O(E \\log E)."
      - kind: "aspect"
        label: "Kahn's"
        text: "in-degree counts, seed the queue with zeros, enqueue a neighbour only when its degree hits 0. `len(order) != n` means a cycle."
      - kind: "aspect"
        label: "Weights decide the tool"
        text: "equal → BFS; 0/1 → deque; non-negative → Dijkstra; negative → Bellman-Ford; DAG → relax in topological order."
      - kind: "cloze"
        label: "____ — Every template here avoids recursion because a 10^5-node line is a legal input."
        text: "Iterative by default."
  - id: "master-complexity-cheatsheet"
    title: "Master Complexity Cheatsheet"
    phase: "Phase-18-Templates-and-Cheatsheets"
    url: "/dsa-with-python/phase-18-templates-and-cheatsheets/master-complexity-cheatsheet/"
    patterns: ["arrays-and-dynamic-arrays", "hash-tables", "heaps-and-priority-queues", "binary-search-template-and-variants", "merge-sort", "big-o-and-complexity-deep-dive"]
    prompts:
      - kind: "aspect"
        label: "The budget"
        text: "- about 10^8 simple operations per second, and an order of magnitude fewer in pure Python. Do this arithmetic before choosing an approach."
      - kind: "aspect"
        label: "Constraint to complexity"
        text: "- `n <= 12`: O(n!) · `<= 25`: O(2^n) · `<= 500`: O(n^3) · `<= 5000`: O(n^2) · `<= 10^6`: O(n \\log n) · `<= 10^7`: O(n) · beyond: O(\\log n) or a formula."
      - kind: "aspect"
        label: "Python data model"
        text: "- `list.insert(0, ...)` and `list.pop(0)` are O(n); `deque` is O(1) at both ends. `x in list` is O(n), `x in set` is O(1) -- the most common accidental O(n^2)."
      - kind: "aspect"
        label: "`append` is O(1) amortised"
        text: ", O(n) on the resize. Quote the amortised figure for a loop."
      - kind: "aspect"
        label: "Recursion costs O(h) space"
        text: "and dies at ~1000 frames in CPython."
      - kind: "aspect"
        label: "Read the bound's variable"
        text: "- O(nW) and O(n \\log R) are polynomial in a value, not a length. That is what makes a \"fine\" solution time out."
      - kind: "aspect"
        label: "Beating O(n \\log n)"
        text: "requires leaving the comparison model: counting or radix sort."
