        text: "`n <= 20` in the constraints, and the answer depends on which items are used, not how many."
      - kind: "aspect"
        label: "Encoding"
        text: "bit `i` set = item `i` used. `mask \\| (1 << i)` adds, `mask & (1 << i)` tests, `(1 << n) - 1` is full."
      - kind: "aspect"
        label: "State design"
        text: "`dp[mask]` when the position is implied (e.g. `popcount(mask)`); `dp[mask][i]` when you also need where you are, as in TSP."
      - kind: "cloze"
