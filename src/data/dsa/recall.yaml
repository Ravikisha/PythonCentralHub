        text: "Both fail silently on a disconnected graph."
      - kind: "aspect"
        label: "Negative weights are fine"
        text: "for both -- the cut property never sums weights."
      - kind: "cloze"
        label: "____ — Equal weights mean several minimum trees."
        text: "The weight is unique; the edge set is not."
      - kind: "aspect"
