        text: "`sub = (sub - 1) & mask`, O(3^n) across all masks."
      - kind: "aspect"
        label: "Tree DP"
        text: "no table: post-order DFS, each call returns what its parent needs. Often a tuple: `(rob, skip)`, `(covered, uncovered)`, `(height, best)`."
      - kind: "aspect"
        label: "Cycles break tree DP"
        text: "condense SCCs first, or use a different formulation."
  - id: "classic-dp-lis-lcs-and-edit-distance"
    title: "Classic DP: LIS, LCS, and Edit Distance"
    phase: "Phase-12-Dynamic-Programming"
    url: "/dsa-with-python/phase-12-dynamic-programming/classic-dp-lis-lcs-and-edit-distance/"
    patterns: ["classic-dp-lis-lcs-and-edit-distance", "dp-sequences", "lis", "lcs", "edit-distance", "from-recursion-to-dp", "binary-search", "google", "amazon", "microsoft", "meta", "uber"]
