# =============================================================================
# Public DSA study sheets, transcribed by section.
#
# Problems are listed by TITLE, not by LeetCode number: the sheets themselves
# publish titles, and a title survives LeetCode renumbering. scripts/merge-sheets.mjs
# resolves each title to a slug in problems.yaml and writes the membership back,
# so a title that fails to resolve is reported loudly rather than silently lost.
#
# `count` is what the sheet's own authors claim. scripts/validate-problems.mjs
# asserts the transcribed list matches it — that is how we catch a dropped line.
#
# Sources are recorded per sheet. Company/frequency data is NOT taken from here;
# see companies.yaml for that, and read its caveat.
# =============================================================================

