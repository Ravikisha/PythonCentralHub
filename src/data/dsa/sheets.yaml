# -----------------------------------------------------------------------------
# Striver's sheets are indexed by STEP rather than by problem title. Their
# problem lists live on takeuforward.org and are largely platform-agnostic
# (many entries are GeeksforGeeks or CodingNinjas links, not LeetCode), so
# transcribing them problem-by-problem would produce entries this site cannot
# link to. Instead each step is mapped to the pattern pages that cover it, and
# `<SheetTracker sheet="striver_a2z">` renders step -> our-pages -> problems.
# -----------------------------------------------------------------------------
striver_a2z:
  name: Striver's A2Z DSA Sheet
  author: Raj Vikramaditya (Striver)
  url: https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2
  count: 455
  by: step
  blurb: >
    The most complete free sheet, and the best choice if you are starting from
    zero rather than topping up. 455 problems across 18 steps, each with a video.
  steps:
    step-01: { title: Learn the basics, count: 31, patterns: [introduction-to-dsa-with-python, setup-for-cp-and-interviews, python-data-model-speed-reality, stdlib-power-tools-for-dsa, big-o-and-complexity-deep-dive] }
    step-02: { title: Important sorting techniques, count: 7, patterns: [elementary-sorts, merge-sort, quick-sort, python-sorting-and-timsort] }
    step-03: { title: "Arrays: easy to hard", count: 40, patterns: [arrays-and-dynamic-arrays, prefix-sums-and-difference-arrays, kadane-and-maximum-subarray, matrix-and-grid-manipulation, cyclic-sort] }
    step-04: { title: "Binary search: 1D, 2D, search space", count: 32, patterns: [binary-search-template-and-variants, binary-search-on-answer, binary-search-on-rotated-arrays-and-matrices, quickselect-and-nth-element] }
    step-05: { title: "Strings: basic and medium", count: 15, patterns: [strings, frequency-and-anagram-counting, palindrome-patterns] }
    step-06: { title: Linked list, count: 31, patterns: [linked-lists, fast-and-slow-pointers, in-place-linked-list-reversal, dummy-head-rewiring-and-merging, copy-flatten-and-reorder] }
    step-07: { title: "Recursion: pattern-wise", count: 25, patterns: [python-recursion-and-iterative-conversion, backtracking, subsets-and-combinations, permutations-and-arrangements, divide-and-conquer] }
    step-08: { title: Bit manipulation, count: 18, patterns: [bit-manipulation-tricks, bitwise-xor-patterns] }
    step-09: { title: Stacks and queues, count: 30, patterns: [stacks-and-queues, monotonic-stack, monotonic-deque, stack-parsing-and-expression-evaluation, design-with-stacks-and-queues] }
    step-10: { title: Sliding window and two pointer, count: 12, patterns: [sliding-window, two-pointers, prefix-sum-with-hashmap] }
    step-11: { title: Heaps, count: 17, patterns: [heaps-and-priority-queues, top-k-elements, two-heaps-and-running-median, k-way-merge, heap-sort] }
    step-12: { title: Greedy algorithms, count: 16, patterns: [greedy-interval-scheduling, greedy-reachability-and-jumps, merge-intervals, sorting-with-custom-comparators, sweep-line-and-event-counting] }
    step-13: { title: Binary trees, count: 39, patterns: [binary-trees-and-bst, tree-bfs-and-level-order, tree-dfs-paths-and-sums, lowest-common-ancestor, tree-construction-from-traversals, serialize-compare-and-subtree] }
    step-14: { title: Binary search trees, count: 16, patterns: [bst-patterns, balanced-trees-overview] }
    step-15: { title: Graphs, count: 54, patterns: [graph-representations, breadth-first-search, depth-first-search, graph-traversal-and-connected-components, topological-sort, cycle-detection-and-bipartite-checking, shortest-paths-dijkstra-bellman-ford-and-floyd-warshall, union-find-disjoint-set-union, union-find-problem-patterns, grid-traversal-islands-and-flood-fill, multi-source-bfs, minimum-spanning-trees-kruskal-and-prim, strongly-connected-components-and-bridges] }
    step-16: { title: Dynamic programming, count: 56, patterns: [from-recursion-to-dp, one-dimensional-dp, two-dimensional-dp-and-knapsack, knapsack-variants-and-subset-sum, classic-dp-lis-lcs-and-edit-distance, dp-on-grids-and-intervals, bitmask-and-tree-dp, advanced-dp-optimizations] }
    step-17: { title: Tries, count: 7, patterns: [tries, trie-patterns] }
    step-18: { title: "Strings: advanced", count: 9, patterns: [string-algorithms-kmp-z-and-rabin-karp] }

